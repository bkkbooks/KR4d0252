body:
  text: 提要緣督集二十卷别集類三宋臣等謹案緣督集二十卷宋曾丰撰丰字幼度樂安人乾道五年進士官至德慶太守真德秀幼嘗受學于丰及執政奏取其集入崇文四部當時嘗板行於世歲久不傳元元統間丰五世孫德安購其遺集得四十卷翰林學士虞集為之敘謂其氣剛而義嚴辭直而理勝得於易之奇詩之葩其文今見道園學古録中然當時欲授梓不果至明嘉靖間詹事講始選録十有二卷刻於宣城卷末有萬錡後序稱摘其尤者存之今觀所分諸體如五言排律類中惟有排律一二首餘皆五言詩七言排律類中皆七言古詩無一首為律是古今體且不能辨則其去取乖謬大概可知蓋事講從羅洪先遊日以討論心學為事文章一道非所深研遂使丰之菁華反因此選而散佚殊堪惋惜惟永樂大典編自明初尚見丰之原集其所收録較刋本多至數倍今據以增補乃裒然幾還舊觀佚而復存亦云幸矣丰仕迹不顯頗以著述自負集中如六經論之類根柢深邃得馬鄭諸儒所未發其他詩文間有好竒之癖要皆有物之言非膚淺者所可企及亦南宋一作者也丰晚年築室自號曰樽齋故是編一名樽齋集見於宋史藝文志今從虞集所廣仍取緣督為名集序稱凡四十卷而宋志乃作十四卷蓋刋刻傳寫誤倒其文今原目不可復睹謹據所存各體以類區分共釐為二十卷乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序緣督集者故宋德慶太守曽侯丰幼度之文也侯撫州樂安人登乾道己丑進士第積官至朝散大夫參知政事真公德秀幼嘗學於侯侯殁真公志其墓石納竁中不得見而侯之孫焄以蔭補官歷鴈汊海口兩監鎮調平江府節度推官則由真公念舊而推引之也二百餘年而書亡國朝元統初今監察御史前進士燮理溥化來監其邑詢求其鄉之先生舊人得其族譜兩卷故翰林學士吳公之所敘也又命侯之五世孫德安購其遺書得今集四十卷將刻之而燮君召拜御史書未及成後三年德安求豫敘之按樂安未置邑時地屬廬陵之永豐其先在唐末五代時有異人善相地者為之葬而子孫果蕃以盛如其占江鄉好事者人人能道之往觀者至今車轍馬迹不絶於其里其顯者則莫盛於德慶矣侯方未第時自著其族譜敘以為逺不及溫陵宣靖公父子福德功勳之盛近不及南豐子固兄弟文學名位之著慨然有自憤之志不一二年遂䇿名大廷其志亦宏矣哉豫得其所欲刻者而有以見之其氣剛而義嚴辭直而理勝其有得於易之奇詩之葩者乎取譬託興傑然不溺於風俗山川磅礴雄偉之氣蓋有以發焉夫物之精華久而不滅則有神明之助者矣一編之書獨發於五世諸孫之手殆非偶然也德安能儒能醫則文理之美隂德之厚尚有以昌其書者乎侯登科之年則我先忠肅公入相之嵗俯仰今昔故為之書虞集伯生序
