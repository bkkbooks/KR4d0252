body:
  text: 緣督集卷三宋曽丰撰七言古詩鏡香樂安縣治之西故有蓮池久漸湮廢令尹趙公子季溫善恭芟穢疏清築亭其上取李太白荷花鏡裏香之句扁以鏡香凌波仙子濃淡粧六月鑑湖夜乘凉低頭貪照廣寒影開口失噴清靜香花縣草池漪且緑疑自鑑湖分一曲若為仙子不呈身無乃主人猶負俗新逢好事公子來十年水鬱一旦開動搖倒影弄金彩勾引回風生麝煤傑題所扁危亭峙仙子涵恩勿私喜百里黔氓屈者伸非徒恩汝數仙子長安得暇逰昆明紫槖初開有餘馨主人顧影頭尚黑仙子聞香眼重青題宜黃鄒聖言宜雨亭謂海棠也佳人一代傾城色和氣醺酣更塗澤胭脂凝汁覺差濃頥頰盎光疑大赤水沉浴罷餘精神蕩去人僞還天真東風吹開巫峽雨西子化作陽臺春夀富陽宰余寓富陽東郊孫氏之西爽樓九月四日是為邑大夫慶誕之辰不果闖賀用課古風侑以尊酒盆菊為夀秋途琴劒留東坰午夜齊房發西櫺協氣橫流太白嶺祥光上屬長庚星詰朝亷訪太丘長三千珠履羅芝庭誕彌厥月衆所賀止或泥之豈忘情飲君以蜀州竹葉之酒食君以酈縣菊花之英挼英探酒非俗事敢煩素素相卿卿既多且㫖奉以進乃賡載歌坐而聽酒有香于以却君之宣髮英有味于以制君之頽齡爬搔黑頭戴大豸磨切齠齒吞長鯨二十四考相唐國一百六嵗侯羅城貂蟬何如外望重鍾鼎不屑初心輕拔腳歸尋耕釣盟割棕為笠藜為羮一洗重席兼珍腥吾身吾口已中清露頂灑風潄泠泠更與赤松俱長生題永豐吳尉當山亭家居所至與山對官居所至與山背眼中悔失真峥嶸得其似者宜加愛尉仙三令姦膽寒突兀數椽答清閒誰橫荒壘簷以外自覺幽趣山之間有一假清無㸃俗當山也是清題目不道尉仙心更清杖履當車蔬當肉甲申大水二首吾州背山面江流一雨便有泛溢憂况復梅霖倒江海白晝洶若龍移湫眼看上流沒髙樹下流屋廬渺無處君不見甲子之嵗至甲申如此灾變已三度歙水震蕩方流東婺水南來塞其衝二水爭雄屹不去孤城匯為河伯宫經旬水落流民復身在不用嗟無屋君不見去年金人破淮壖城郭千里無人烟題項聖尹竹齊之君命屯有孤辰之子德孤無同人天遣之君友之子賔主相忘無彼此出牆春梢道骨輕侵書脫色天資清客來面目挾塵土對君有頭不敢舉客來言語挾塵埃對君有口不敢開坐聽一賔陪一主夜雨秋風相爾汝主人養髙賔養虛九天上與神龍俱同張隨州賦㑹稽朱子雲席上丹桂月娥施朱小留殘天風吹上桂樹端葉猶强項護故緑花獨多情染餘丹夜來誰借修月斧和根剟與凡世看世人不識天上種醉眼恍惚魂溟漫我嘗浪作折桂看驚見似與丹窟般主人視花孰風韻等是姓朱俱可觀况逢問字載酒客不妨為花理杯盤賞音莫憚腕欲脫花到夜深不禁寒稽古堂今人不足與之謀心向三都以上遊有集可明經子史無秦難别夏商周心融口笑先儒泥一萬餘言解三字粹精還我聞未聞糟粕從渠味無味懸知書者古之餘稷契臯䕫讀何書猶期立腳羣賢上更請回頭萬物初題黃萬安治東樓樓面自東如擇對景隨樓面若相㑹眼前獻狀有龍頭腳底乘機可鵬背坐躋百里東風中起望長安馬首東府寺有人能北事乾坤無處不東風五雲閣為黃萬安肅父賦一合乾坤羅萬象中有連天雲錦帳分光日月兩輪間聚䕃神仙十洲上盤緗錯縹天上無若為雲錦如許都媧皇錬石補天了倥偬不及收其餘織女得之資以幻手與目謀生燦爛使君寄下召還祥令尹收為公退玩登臨輒玩罷輒忘令尹胸中自含章製錦猶餘五色線歸朝可補堯衣裳正月雨雪少陽當進猶自抑老隂當退猶自激煦煦才融地出青颼颼又肅天生白一曝十寒權在天春行冬令風弄權我問天去天已逺懶能更上訟風篇吾郡之望羅彥方過聽以余有詩癖古風特枉傑作之貺不可虛辱賦一篇謝之聲生於氣詩之體於氣要窮所從起事制于義詩之理於義要窮所從止一元開闢三才矣萬世綱維十倫爾我初傳此無上宗君今示我未到工胸中周召次畢公筆端雅頌餘國風不容隂陽作窮通直可天地作始終寄題夏椿年樓廣寒韻度中央質故侍仙娥新見黜髙天委氣得金行平地拔身成玉立月下風前為誰香諸郎一詠翁一觴功成寄語邵氏子有西樓後無東堂問月臺主人詩豪寄於酒萬象無非酒之友主人酒豪寄於詩萬象無非詩之題若為詩酒興俱發平時泛愛今一割不問其地偏問月月不長如日星然乍望乍朔作晦弦要之缺者多於圓主人乘風踏鵬背方在急流俄勇退似月之明居以晦舉酒相邀傾酒酹問耶對耶此其槩收光反耀照其內妙與道俱不容喙題三衢汪學士聽雨軒公家如許好昆仲不數河東舊三鳳床敷對語無限春簷滴關愁不成夢馬援看鳶始回頭知機恐不似少游看鳶機落聽雨下雖悟已輸公一籌贈豫章來子儀言詩少年氣宇要自恢見人賦詩謂為才出入常將筆裝懷中年心地要自息見人哦詩謂為癖起居常把口掛壁子儀倡誦得意詩句中勾我已懶機多年抱渴滿意沃半世稱雄望風雌詩源始自葛天氏三人投足歌牛尾萬象包羅八曲間國風雅頌其流爾八曲不幸世不傳傳世僅餘三百篇漢唐作者代角立庶幾老杜氣渾全本朝詩數江西𣲖黃公太史為之最大成未集夷惠行具體猶微顔孟輩𣲖流到今嗣者誰青出於藍吾子儀拄杖初擔教門出便敢喝佛罵祖師我當拗折君拄杖大家俱以背為向能出二十四人前更超三百五篇上題永豐鄭丞梅澗分隂分陽天得清生水生木清降精懸知梅與澗為一交涵互養清難名客來强立請題目擬之萬物無一足巢許立身今古髙夷齊受命乾坤獨主人氣與梅俱移平淡之中餘崛竒藍田松竹須品題今年隨牒梅勿疑主人心與梅俱化髙潔之中餘藴藉瀛洲風月須摹寫明年入朝梅勿訝獨不見淇竹主人衛武公出相周家了勳庸老矣歸與奉從容主人與竹俱髙風武公與竹為不朽萬古淇澳詩一首主人有以為梅夀我請置之淇澳後小立贑灘崖石崖石崔嵬千萬狀舟人來往篙其上數十年間人已非百千劫後石無恙吾生修短不自由短中自有可以修五言七言句外意千古萬古江東流舟中書懷孤篷轉徙空隨牒一出侵尋費三月厭從夢境作寄居欲赴鷗羣填見闕我且戒塗兒挽之褁糧又趂蒲帆西初心猶幸江神信後計不教兒女知舟行過龍騖洲舟人指似桃花林滿山爛漫一圑烟火百十家一叢林木千萬花浪遊那料有竒遇似入武陵眼生霞詩人多愛疑可賞舟人多忌戒無往中途還未免迷行初意得無成妄想漁翁禪伯花所私成仙成佛未可知花今於我有大造六幅歸帆春水肥送陳制自富沙守京口殿上舊開醫國口閩中新出活人手亘野桑麻水旱餘連村炎火兵戈後飢得以食寒得衣召為之父杜為母公為民賦閔雨詩民為公立遺愛碑古人祈天翦爪爾今守禱佛燃臂誰充其不忍寖以大德之難忘特其微東閩人怪去何遽南徐人怪來何暮油然無心出岫雲去來遲速隨所寓漢相無人不曰歸韋賢未老何時去贑縣向宰座上見緑蕚梅主簿程開老相勉賦詩素與百花少相諧醉眼時為梅一開嶺南嶺北幾十種人所常見非竒瑰中有孤根别風骨白金鏤盞玻瓈臺白華紅蕚雖傾國但恐紅非本色來逃紅歸緑未到真與真相近亦天德化工厭駁㑹還純華蕚併教同一白題遊德昭夀藏名曰復庵劉伶未死先荷鍤自負上超無礙法死則已焉埋謂何東坡猶笑未為逹之君之學齊死生穴其吾屋屋吾穴咽日飱霞容有功馭風騎氣得無訣歸歟歸歟彼大通復哉復哉此虛設題滄洲畫趣一身超忽白雲表雙眼低回白蘋杪沙隨風捲黃莫涯草與天連青未了摩詰胸中幾麋丸詩寫其真更留殘破除桑落斗升後收入鵝溪尺寸間想象訾家聊寓目指顧瀛洲方䇿足中人宜在瀛洲宿中宵夢在滄洲浴覺寫兩洲為一軸馳譽丹青從謂俗題黃舜卿雙溪閣山無背宅宅何勝門未納溪溪是剩一閣翬飛若見招雙溪蟠屈如回應有酒不容閣生塵無詩莫與溪寫真秋碧澄寒石齒齒春黃漲暖風鱗鱗有如此水皆詩思半酣還癢客之技氣之濁者客勿諱主人胸中有涇渭味之美者客勿矜主人胸中有淄澠辨入㳙滴太分明醉逰汗漫真混成客與主人俱忘形過泰和赴主簿鄧楚材豫章貢圍之約福建人才古鄒魯文章師匠道宗主餘子姑作尋常看此公僅能一二數太學頡頏賦爭衡凌雲之氣擲地聲鯤鵬誰礙天南去麒麟猶落地上行南昌傾蓋恨不早西昌扣門喜欲倒風月那容酒絶交江山不許詩在告宦逰同調能幾人相逢莫厭情相親言下甘心聽苦口鏡中白髮催青青題饒德裕三益軒過從義要如膠漆琢磨功要如玉石二者于兹有一偏雖過聖門未之入德裕耽儒今二毛一軒灑落僅容膝詩書執禮不放閒直諒多聞誰較密仲修國老曽鼎臣各於三者得其一曵屣相迎下榻留冒雲蒙霧不知濕松梅竹裏凛不凋形影神中冥莫逆問答小參文字禪賈誼升堂馬入室更能尚友古聖賢蘭移其氣金移質一線溜作吞天濤十丈花成盈掬實擴充未下反約功軒今所揭乃其適顔淵復禮老歸根今揭吾知猶缺易題劉武翼息齊天地一從開闢始左旋右轉長不已詰所以然氣使之君獨不為氣所使平生由氣今自由三平二滿過即休千里收回渥窪馬十年養熟溈山牛本來無動那得靜關著一毫還自剩雖任鵲安頭上巢更防人打耳邊磬應童子科歐陽文成覔詩漫以塞責廬陵童子謂姓李臨川童子謂姓王二子讀書選德殿氣吐虹霓口翻漿六經諸子成串落天子喜之移御床奏對首肯去目送青衫黃牒恩異常江西得此二童子後生氣倍聲名場前聞但有晏元獻今繼者誰其歐陽身軀眇小膽氣大齒髮幼艾言語蒼况能大書開龍蛇一字欲作千尺强明年試罷春晝長低頭拾官回未忙馬蹄輕踏百草香鶯花助喜酒助狂長裾短刺傾侯王早著歸鞭榮故鄉我其候之螺水傍贈南豐胡國華軍山未信旴水屈清淑之氣相盤鬱天地有時不關防古今何代無人物道德大成文小成君小成者精逾人問我江西𣲖從此南豐不是儒家子劉文叔見贈回贈一篇我詩求我渾沌初君詩求我糟粕餘低頭小參有頓漸撫掌大笑無精粗誰收六律入三類更斂八風歸一噫四時元自五聲生無聲敢問詩安在送留尚書再守贑之一年移帥豫章贑農雖懶連嵗豐贑囚雖黠連嵗空農囚今昨性豈異今守蓋與昨不同鬼窺莫見活城手酒澆不下憂民胸十年五度看易守萬口一辭獨歸公公凡兩來亦兩去前去殊邦今本路德公吾與軍民同軍民未解吾細諭向汝思公公復來今公去汝汝勿慮僅隔一江千里間豈忘三任五年處軍民雖諾猶動情不忍江頭送公行淚隨贑石順流下碑在巽門前面橫千里和氣散萬里一城春風分十城但疑贑人送未了洪人又送朝行京辛丑大水天公哀此生人苦潸然出涕灑下土五晝五夜涕不已平陸成河山作渚是方為邑本窪下今者之變頃未覩何止人家水半扉或壓或溺遍處所居家老稚幾為魚夜乘一葉投山塢雖知此邦禍可免頗念吾廬欹莫柱朝登山巔聊放目流尸蔽江可勝數何處奔洪之所擠一旦至斯辜非汝天公用是涕愈流陽侯正自喜且舞我願天公且收涕憂之反傷亦奚補但令老眼開日月蒼生自然得安堵題曽見卓此君軒衣冠濟濟弟若昆詩書纚纚子若孫容有玉立人照門得無玉立物照軒軒外清凉别乾坤一㸃俗塵不得干其間蓋有此君存此君根性抱嵗寒初交可作久要看主人對之忘朝昏茶鼎烟中爐薰燔酒樽隂裏書帙翻坐探物初窮道原中有所得不自尊與此君結終身歡莫逆之意寓不言行藏相約無背轅數猶未偶姑屈蟠峻節孤標老丘園天假其時忽騰掀鳳鳴龍化駭觀聽功成不受聲利吞白雲深處同歸根吉之南門外見木芙蓉爛開小春催出傾城色笑倚墻頭若招客芬芳猶帶秋風殘妸娜豈宜江路側詩眼驚紅狂欲呼熟看似細又似粗花神留為菊後乘天意遣作梅先驅豫章上游生市前江中洲上至德觀側柏樹甚老何命之薄彼哉柏豈無生處生于石老去根猶强自爭春來石豈能相厄蛟龍拔入盤重淵雪霜放出參九天至大至剛劫火後彌髙彌邵妖風前道人淡咽得吾味久馭清風騎紫氣吾骨到今猶未蛻庭前自適西來意題塢季文送清軒主人胸次風韻勝萬象皆傾如聽命開窗凝目立相招霽月影從溪響應神迎氣送煩此君拜嘉有何答殷勤棐几蒲團千兔頴茶甌酒碗一爐薰改秩注縣西歸過上饒見太守同年莫郎中集英殿前始相識公已䇿名上通籍銀章朱紱爛映身鑠我青衫黯無色上饒城裏重相望平聲公已厭直辭周行皂蓋朱轓炯當眼鑠我墨綬昏無光浪說同年兄若弟升沉不翅雲泥異分疏胡越敢尋盟義重丘山肯忘勢一麾初守虎頭州差池不及從之遊僅收劉公一尺紙堪比漢家千户侯鴉青今襲陳腐語持以掃門應勿阻逺圖要覔進德方近效仍求為縣譜題吉州聶倅談風月軒黃堂指顧了凡最紅幕奔馳了苛碎更無可了别駕翁贏得徜徉是非外未有可偷風月天崢嶸新起東偏廢風含渾沌竅裏音月弄光明藏中態吹開雲雨天益髙照破山河地加大兼之足以答公餘妙處何人同領㑹無酒客有詩相酬有酒可無客相對主酣客醉舌俱饒說到無聲無色界髮難恃細併毛融骨不禁清連肉蛻目不信為山河影耳豈信為天地籟主困欲眠客且歸不容耳目寧容喙南康劉尉於㕔事之東開軒曰清瀨蓋取其前松聲然也坐曹在西退食東一間然爾萬不同彼無乃俗飽吾䀨此不勝幽醒我聰不律不吕自中節非䕫非襄誰傳宗意其金沙鴻磅礴否則銀漢鍧穹窿開忩即之辨所以老松不受風所攻松莫之禦非自暴風無所爭不相容二者無心一有感自然成聲關大通混沌之竅君之耳松風觸處天機融聲之真者非固有况復流歸形似中潺潺㶁㶁蓋其似得真忘似軍新功更收吾耳聽以氣一掃從前真似空謝新淦令徐信甫至贑相過永嘉之重自晉始積至本朝始多士大科異等固非常文章道德相角掎淳熙癸卯徐令君相逢欲執弟子禮聊將舌夲吐寸機輒自腳跟參萬里藏中觸處隨光明言下從誰得源委國子博士陳先生初受皮膚終骨髓孤蓬今轉大江西猛象欲踏黃河底但恐黃河深更深水浮太空空浮水褁糧學道僕馬疲歸家落照在簾裏自有餘師更求師棒頭打出乃其理况人胸中各法門陳君韓子吾栁子雖有心印不敢傳恐君呵佛罵祖爾題王欽州子澤雙清閣馬蹄車轍前門外江聲山色後堂背左手持盤右把杯家人怪問翁何在小閣峥嶸負後堂圖書左右翁中央一塵不容犯眼界萬象無計逃詩囊蚤作從渠醉名利夜卧從渠夢朝市一詠之餘更一觴翁兮醉夢華胥氏甘老堂功名鏡裏猶黑頭誰子速之營莵􅾗四朝元老人姓周掃三大字蟠龍虬元老之門幾從逰天上公子第一流十論較之過秦優記室有勞無束修郊霈異恩小相酬過而睨之海中漚從渠進進吾休休胸中一壑復一丘酒發詩豪不宜搜風月自與毫端謀木奴竹君嵗所收不翅漢家千户侯歸哉老矣餘何求䑛蜜啖蔗味悠悠孤松野鶴無春秋陳良臣之子正功肯學能言求余印可學探玉甃千仞井筆扛龍文百斛鼎歸根可以後冥莖發刃難於先肯綮㸃鐡要之便成金即心是道道是心一案孔門重勘結小圖為賜大為參題趙州通判陳日華二友齊吾初丞小邑誓與松竹為膠漆公今丞大藩誓與松竹為金蘭維松若竹有何德和公玉立成三益矯矯摩雲性天髙亭亭傲雪心地直風月外吾吾强哦其如松竹偃蹇何橫江太守風月主公與平分無乃多况胸有眼筆有口大與松竹相諧偶張陳漫浪耳熟初管鮑綢繆嵗寒後三友莫逆俱嵗寒猶遺其一非簡歡四科參偶不與班孔子無容心其間愛參初不異問顔寄語梅仙勿銜寃前髙凉推官陳漢臣惠佳作索俚編不可虛辱授之後集古律矣復課數韻語謝之太虛生氣氣生風風又生聲詩在中固自性情元具足何當學問更加充形容草木魚蟲意雖妙猶為墮於藝雅頌聲音召隂陽聖賢道義包天地句拙莫謝來章工尚深自養細自融和順積中鬼不見英華發外天無功癸卯九月末贑吉大水秋江次苐落到底半夜忽如潮湧起方陵屋山遽城頭已失洲背况沙觜五月小潦似未傷九月大潦疑非常感召之心上所謹推原厥咎誰其當一部麟經幾書異敢可叮嚀今執事休責漢公賢不賢且論堯具偹未偹題陳宗元立齊人言禮起於太一吾言禮止于皇極强名皇極體何如卓然萬象中間立流言鼎鼎三十餘古人有立君可無克己未追顔所復過庭猶學鯉之趨五禮同歸一中爾何當中立而不倚膰肉無來孔子行皮冠不設虞人止區區行止未足輕擴充更可輕死生黃壚在前始易簀白刃垂下猶結纓一有所立百無抗底柱中當拍天浪千古不磨立齊名泰山北斗在頭上贈江宰彥通富沙耆舊江先生方冊之中久聞名今識其子長安城中年狀貌老典型居官不翅氷玉清未嘗一出清之聲臨事不翅氷鑒明未嘗一示明之形牛刀初割琴初鳴市稀善履鮮善烹江華百里農桑氓隂受令尹生與成尚不能窺豈能評兩部使者識理精循吏政出吾六經一元動蕩萬彚亨不以能稱乃真能交章疾置聞朝廷明公歸重蓋如此素履後修想俱偉立朝致主從今始廊廟規摹寧出是貞觀三錢一斗米房杜傳中無可紀事業文章非異軌誰云解此不解彼學詩反幾我開啓生平言行詩之理游泳於詩未知爾國風雅頌興賦比類發於情止於此六義同歸一宗㫖包涵萬象無涯涘騎驢覔驢殆忘巳子歸反聽收初視三百篇中參到髓題顔慶逺三友亭天一生水清之精天三生木清之英他清可備吾題名不得精英未為清顔子園中亭突兀逺橫一水近三木取其近者共所欲太清也自生毛骨餘豈無友非嵗寒嵗寒之友天數三主人更與三者參天合人合情相涵四清之清俱不凡題胡邦仲霜節堂此君胸固有虛室六氣薰酣無不適所禀寧非道之質此君貌固能圓機四季變更無不宜所立寧非聖之時其表無方裏無物妙與大道相出入清節凌霜特其一秋風夜雨君曰噫名我字我敢問誰無乃未為大相知守節雖賢一於正聖人逹節百其應君亦能賢亦能聖姑於節論猶失訂標致孤髙所持徑伯夷獨立君制行主人加愛又加敬根器渾涵所成逈顔子屢空君盡性客子三嘆更三詠寄題項聖豫盧溪書院中興天子旌義門榮光猶足昌弟昆家庭衮衮義子孫下相郎君開義孰美意非徒淑姻族鄉里蒸蒸義風俗乃翁固喜兒讀書更喜他人與兒俱兒今不替翁之初人人忠孝書緒餘初唐元勳幾卿相游學豈無他絳帳姓名半出多顯揚河汾便是盧溪樣嚴子陵周家刑不上大夫法固不足禮有餘何人不願立朝路未老誰肯甘田廬秦坑學士置勿論漢嫚大臣眂如奴逸民不出朝士去前有兩生後二疏世祖聰明失之察待臣少禮多以法當時祿位列三公危似千鈞懸一髮先生識帝貧賤時富貴何妨與共之云胡君房留不住無乃平日窺其微龍顔之疏顧豈忍烏喙所伏那可知初來髙蹈疑矯世從後逆覩信知幾退身不勇公孫賀明泣危機終自墮先生明甚勇如之天地萬物莫吾挫將星羣立客星孤羣恐難調孤易禍帝座旁邉睡熟間夢魂已在桐江卧將星耿耿亘今明不比客星明更大
