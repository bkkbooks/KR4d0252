body:
  text: 緣督集卷十一宋曽丰撰啓轉官謝丞相啓招致煩言改除散吏歸家引咎猶虞司敗之深文積日計勞豈謂考功之浪許秩增者一事反其常其得而不驚乎所慚者非據爾竊以古之宰邑職曰字民用度無濫門稅租有彛矩畀田授地僅什一之征供吏給徒能幾何之費惟厚豫而薄取故少毁而多譽屬者縣家之難甚哉財計之重月輸郡帑寧容差緩於崇朝季撥漕儲不許少遲其浹浣均泛用於有常之外取羡數於已足之餘幸而辦頻年新賦之粗登甚者責纍政宿逋之併償上馭下不寧於束濕孰敢它辭卑扣尊何啻於探湯安能自訴偷塞目前之責寖招李下之嫌輕信浮言勇行成按諸公非善回天者一敗豈免掃地耶莫之苟逃何以平進兹蓋伏遇某官學融上達識㑹大通一於好惡之偏詞參以是非之至理偶然詿誤獨不與故犯殊或者詆訶得無從私意出一怛動衷之莫禦百端致曲而不辭先裁以中始白於上暴勝立威之酷直期鑠金蕭何用法之寬曲賜全璧了知漢網之闊一出伊衡之平成始成終吾君吾相某敢不勉尸清净恭贊明良三沐三薰華封人孰盡祝堯之意一飲一啄王仲淹何敢忘孔之恩不至喪元未論報本赴廣倅上潘直閣啓散職歸休誤恩起廢一行作吏半刺雖未為卑十國為連元戎顧猶在上上下所存名分然也起居之缺禮文可乎將以斐然致其敬止恭惟某官為質也敏得天之全切磋琢磨不煩師友之力視聽言動能著聖賢之功學問成而器識隨之聲名出則人望歸矣得官未稱其德為政不専以才推此一心所事循吏傳之事形諸千里其民華胥國之民舉嚴陵之政聲合婺女之鄉譽朝發衆口夕聞九天詔除漢郎自有典故擬議廣帥它無老成十四州安得以自伸二千石又從而相屈堅持一靜坐鎮百浮但凝清香而飲醇酎不治而治餘尚何求元功之功自可不朽某决科餘三紀改秩十七年貧則如初悔之似晚耕焉之謀以仕焉而廢差毫繆千薦者之力比按者則輕進寸退尺又抗塵容而出下䇿三城水陸征租之入八邑軍民口體之須孰非長者所能為何庸關决未必丞哉之不負有幸依栖倚髙門如末至何奉急詔恐遄歸爾猶及署姓名於紙尾何當效筆硯於公餘狄青還奏粵功南海一澄而終晏宋璟入為唐相巨川初濟而已恬併作頌聲永為口實謝五府堂除廣東運幹啓改秩銓曹初心未遂充員漕幕一飽有涯况適及期而便即祿較其名此視彼則不及揆以實得償失而有餘欣然下拜受之可以藉手歸矣夫惟吏部之立法其責選人也過詳舉主之員猶未全固許赴調京官之闕不容入徒生羡心彼蓋有司吾其何怪身為天子之宰相職事非與它同手握人物之權衡恩施可自己出營營失意者往往歸身焉卑者求髙外焉丐內朝論儻無不允人才安得有淹或左輔右弼前疑後丞各自有見則甲可乙否彼非此是居多不同雖知其資所當然猶牽於勢而姑已矧兹躐等而有請疑若涉嫌而難從偶諸公獨不二三其言在今日豈非萬一之遇恭惟某官從初力學慕古大臣誠以反身與物未接而已信推而秉政同官不調而自諧每發抑揚官吏之機皆符中外搢紳之論須賢之效乃至此孤寒所蒙何幸邪有如疏庸未遽斥絶翻以筆研之末技信其胸中輒收馬牛之踐蹤置之門下豈謂表裏所該無異道不容清明之世有遺才爐韛一施饑寒俱免非以法豫以人豫似出大造無私之私未為官謀為祿謀實為小吏不幸之幸感深語淺恩重身輕不至糜捐未論報塞通廣東漕使黃監簿啓久勞鎮拊遄擢轉輸便道之官咫尺入潮陽之路涓辰視事須臾回嶺表之春山嶽動搖軍民鼓舞恭惟某官學得師友志為聖賢蚤擅科名氣習猶如攻苦之舊亟登朝列聲容不改抗塵之初方快奮揚遽聞恬退謂得州亦可行志雖去國何嘗介懷由來清漳凡幾太守獨爾冦恂之借留一年餘信乎召伯之思自今日始榮升一節馳按百城兹乘軺傳而來乃過侯藩之舊江山草木迎送改觀父老兒童見聞失喜來慰已恨其暮詔歸復疑其遄顧偏方之計孰愈於上京而重內之人奚容於久外某官不辭卑遊難避逺一充臺掾兩易歲華豈圖滿考之將書而獲大賢之是託雖百勤不補其一拙然終事敢渝其初心轉漕關中鮑生安有為蕭相國之助羅致幕下烏公幸毋厭石處士之留迎廣東運使坦大夫啓讞獄奏功疏恩易漕方驚西部奪我東風忽降新綸還公舊治車斾始行而遽返士民才送而又迎其為歡欣甚至鼓舞竊以粵嶠雖分於兩道計臺皆主以獨員編户農桑地僅一十四州之廣歲課出納錢幾五十萬緍而贏惟其斂少而散多是以易虛而難實由鈔法既更之後失鹺司所助之常慶典之恩既覃丁租之數又减歲事中熟有無猶可以通融民間水饑上下必至於窘束與其臨事巧營而旋救寧若先期嗇用而謹防聖賢不易之言今古難行之事非有學力孰塞弊源恭惟某官負抱渾涵薰陶成熟守潯陽之土不以五馬為榮而以千里為憂觀嶺表之風不以四牡為勞而以列城為念無事不以聞於上有功未始動其中廟堂相知恩數自異既徙官而增秩又移節而將輸豈其負才而難遺亦以知道而可用大學之義足用不廢於生財君子之心愛人莫先於節用粵自洙泗已有此學公從伊洛而得其傳號為老成非徒知取而知豫深識大體不至傷惠而傷亷使夫小試其胸中可以大蘇於廣右㑹上引嫌之疏遂膺就便之除人情以前而信今天意移彼而惠此某一從度嶺便欲掃門受知未得所依聞命不勝其喜可傾方寸不出浹旬大夫未出疆望使華之不逺下士已執贄迎騎氣而敢遲通坦提刑啓氣應三陽清流道長身將一節荒服春回融為嶺嶠之和斂作門閭之喜恭惟某官業履修大聲容煦溫自載笑載言而充之莫非仁氣凡一州一路所感者孰不東風萬口合詞千秋為祝家人燕集欣歡滿引於椒花君子泰通超拔上連於茅茹其可為慶所未易言代坦運使到任謝兩丞相啓誤命將輸亟上引嫌之請公朝從欲尋疏易地之榮未出舊封已祗踐事雖便而濫式欣且慙伏念某生賦下材少從末學師友之功尚淺幸獲入官州縣之職備嘗僅能逃責晋叨讞獄政負空餐姑丐奉祠敢圖移節况飛挽夥繁之任非伎能綿薄所堪醝法中更二廣之儲今已貧於曩農田小熟常租之入東猶愈於西兹蒙以易而易難遂得避勞而就佚老矣何幸恩焉有歸伏遇某官學到太初道包羣有調元而一元正五風十雨皆得其時宰物而萬物平大鵬尺鷃各安於分遙憐嶺表遴選計臣一聞孤跡之未安兩與更除而弗厭衣朱公之繡官居難近於私居回墨子之車故部尤諳於新部暑月獲將迎之順暮年免奔走之勞一舉而數利集焉大造於逺人厚矣某敢不勉效尺寸規酬萬分轉漕關中尚當效酇侯給軍糧之䇿通量歲杪要少副冢宰制國用之心代坦運使到任謝樞使啓誤恩將漕抗疏引嫌便道改除回車視事榮有餘而似濫喜不足以蓋慙伏念某學未及成貧不免出一入州縣簿領㳫來而相尋回視燈窗詩書幾至於髙閣更時閲歲覺壯成衰晋領平反厪逃曠斥敢圖移節而督飛芻南方鹽法之更揆之計額而少損東部户編之狹加以丁租之盡蠲問彛費則自如非長才而孰辦付之老拙豈謂往來熟而利害詳將以亷勤或恐取豫公而出內吝恩歸造化事出吹噓伏遇某官命世真儒清朝亞相樞極久歸於掌握璿璣獨斡於胸襟控制百戎山嶽不動而事定品題多士權衡無心而物平致使寒蹤例塵公選西臺已拜松楸偶在而可疑故治未離繡斧雖更而何厭晚景免疲於轉徙炎天省力於將迎新舊之交公私皆便所施厚甚何以稱之某敢不周視歉豐謹權出入雖無求於贏羡要靡缺其經常甲兵不問於廟堂已登平治軍餉猶飛於函洛豈憚驅馳惟誓糜捐庶幾報塞代坦運使到任謝楊檢詳啓將西廣之輸援私嫌而有請易東隅之命乘便道而不勞雖化鈞甄録之公亦樞掾奬提之賜得之逾分處若為顔伏念某奮跡儒科投名官牒資格未離於州縣由緑得緋聰明已耗於簿書覺班成白讞獄方慙於臨遣丐祠豈意於遷除繄外計之非輕况僑居之不便懷疑無措忽拜新綸擬足未前復為故部其為便順之甚所愧僥踰之多雖降自天寧無為地伏遇某官受質已粹加功更深論著六經洗空百氏傳注之學䇿陳千慮壓倒三篇天人之言文行之髙公卿所重兩膺嚴召俱拜偉除持節觀風山嶽動搖而氣懾握蘭奏事星辰辟易而芒寒贊襄宥密之功假借齒牙之論故令遲頓亦竊光華某敢不疾鞭其罷圖稱所骫終恐伎能之短全資契誼之髙王勃在前已幸平反之無失范蠡主內仍欣飛挽之有依代坦運使通新除提鹽談太博啓専城奏效一節升華極目南中雖故在部封之內乘軺東下乃新遷臺治之初公朝尤遴於選人全廣遂為之增重恭惟某官受天間氣為世竒人刻苦燈窗専而且久討論經史博矣又精發為文章妙到古始逺而昌黎近而坡老筆端可與之後先大則文獻小則襄公忠槩當處以季孟四公遺跡五嶺殊尤既具全能自應大用一收朝蹟多望國子先生之還四播召音尚甘繡衣使者之拜豈醝事既更於近制而利權難假於常人輟此老儒鎮時浮議少需事定即詔公歸某嘗幸親賢喜將同事飛芻煮海均為出內之攸司移粟乞醯尚賴有無之相濟通都提舉談太博啓召節及門趣裝上道詔留嶺表雖阻蓬島之清遊寵拜皇華亦為桑梓之盛事方當變法之後又適遷臺之初使者得人士夫增氣郵音所至喜色攸同竊以煮海為鹽生民通用浸浸豪强之用事紛紛鼓扇而為姦齊集其私主持以吏秦防其盜運載以兵漢室懲弊而張官魏人建言而置使考唐遺術比古益精𣙜端雖發於琦課最乃成於晏大農㑹計增入十倍之錢末歲通量實當大半之賦雖若有益於國多矣謂之不奪於民得乎初焉出於因陋而為之久則視以為常而加甚官販官鬻侵漁市價而獨擅利源計租計丁抑配農家而重為蠧本物窮必反道變斯通推行固要人之有才職守尤嫌名之不正顧今天下皆𨽻常平唯是嶠南近才更始去其兼者所以専其任表以都者所以大厥稱移司蒼梧用控全廣事勢須首尾之應屬官為東西之分物論間疑其非難搖國是詔書大勇於發正藉人收付以四十二州之重權出於二三公之精鍳恭惟某官資拔物表學窮氣初渾渾先秦之文章凛凛後漢之氣節淡菴渡海獨與從遊連帥還朝首先薦召有以結兩公之好知其為特立之人苦遭當道之豺甘作退飛之鷁普寧之治聲方著侍從之鹺論又陳非賴粵人孰諳粵人之肥瘠不資朝士莫酌朝論而從違兩端皆全五嶺希有獨惟門下卓在選中方報賜環踵聞持節嚴夫子懷土光生友壻之門朱買臣歸鄉喜動故人之色人皆羡只公獨晏如雖姑假途寧微旬浹之欵曲肯略溫席試發生平之討論近功有以權之逺業於是卜矣某濫聫末至之客欣拜先驅之塵嘗識江南之風流要從名下而即可蜚蓬蹤跡猶幸遇國子韓先生於八千里之餘汗簡馨名何當繼曲江張相國於五百年之後僉所期望亟其勉旃賀坦提刑轉官啓黼坐考功繡衣增秩元康大夫之爵聊復償勞直指使者之風愈為增重蒸出兩眉之喜散為一路之春恭惟某官平生所行一出於學直從起居飲食而始次第用功推至進退升沉之間率常任理幾書奏最一節詳刑平反未嘗以為功全活無意於望報計日計月之事非公本心懋賞懋官之恩有國常制姑事循進尚淹老成或謂年老之遷殆為驛召之漸一朝而上百志以酬某淺學辱知之深愁顔聞報而喜身登八使一官何足以為榮賞及近功逺業可知其得眷足深賀者姑少遲之賀廣東提刑坦大夫特轉一官再任啓雅意解歸特恩因任文階再轉僅酬四牡循行之勞使指重宣大慰百城挽留之望嘆公已久於在外幸我猶得以相依恭惟某官氣宇渾涵官途綿歷嶺表半行吟之跡潯陽餘坐嘯之聲蠻俗告勞聊復詘馬長卿之往越人蒙德自當趣嚴夫子之還姑以內外更迭之制酌其中合於日月論思之地擇所處一路皇皇恐失所賴九重往往重違其情寧屈一賢以寬南顧竚恢殊效而速北歸但一二可書則不磨况尋常何立而非偉凡是逺業所存者直於今恩而卜之某蒙韓見知借漢為頌衣繡使者久驅馳於琅琊泰山之間觀風大夫行超拔於光祿大中之上繼今以往可賀猶多代賀提刑坦大夫轉官再任啓疏榮進秩一時再拜於殊恩乘傳觀風新節復循於故部慰一路願留之切表九重見信之深傳者翕然為之甚喜恭惟某官資充以學實侈於名榮路當翔於太清宦遊肯屑於二廣専城課效政聲已甲於西州攬轡詳刑風采又傾於東土寃獄屢雪寒鄉皆春但積勞而著功合由外以除內懲數更之弊漢宣爰賜以褒書責久任之勳郭伋尚稽於召命朝論自定公歸少遲某方藉餘輝兩逢盛事聞音至止如已得之久次而轉為大夫固未足為揚子雲之賀使訖而還報天子當有以酬馬相如之勞頌詠之私敷宣罔既通廣東漕使馬少卿啓一官左計改秩未諧再調南來趨風有便正萍蓬苦自飄泊與繡斧適相後先得所依棲謂之幸㑹恭惟某官飽韜有本之學熟揉不羣之資娛嬉成文章俯取上第漫浪出仕宦洊試中都隨職髙卑結知君相郎星拱北致主之願未畢酬卿月照南觀風之行不憚苦藏哲於晦以嚴行寬或謂恩比湖而加深斯宜坐與嶽而俱穩嶺表將漕㑹猶未得其人荆南平反公有已試之效疏恩下詔易節按城豈二路上游控山川之交而一心兩耳熟風聲之久取道不逺成功可期湘人送而廣人迎徒爭境上軺車遣而鋒車召恐在道中再歸近君始畢逺業頌言未盡國史不遺某百拙招窮半生坐懶情性耽筆硯是物莫移詩文汗馬牛於饑何補一行作吏而幾困再轉為丞者三年雖多薦書偶一戾格復墮選調來為下賔蕭何漕關中或略藉鮑生之計裴腆在幕下終須期劉晏之知雖無他長敢不自效回廣東李帳幹啓曵裾邂逅已嘗傾意於一見之間轉首差池豈料同官於十年之後並時來上託契則終書尺過於殷勤禮數似乎顛倒恭惟某官好學成癖與書忘形燈火新功半出科第之後旗常逺業初試州縣之間不輕一尉而安之可見平時所養者未露厥頴已雷其聲方梅福解南昌之官浩然期於有立維漢朝虛東觀之選疑以直而不容復此斜飛而南何時穩步而上知音不少待價未遲某有志無資始勤中倦謂道可自文章而入試浪用工然學不為性理之歸終難傳逺方悔少作而收初心技忽癢而復為喜至狂而莫禁關鍵遍求于前輩源流肯徇於専門青出於藍誤以師道為坡公之派白守其黑幸幾商容發老子之機大道得新聞公家直餘事代運使賀坦憲陳廣西漕啓肅奉綸恩晋將漕計觀風察吏易地似勞上塜過家取途良便所得適如其所願相知皆快於相傳恭惟某官學得其宗氣充所養潯陽鎮撫課效有餘而未嘗事名嶺表平反活人無數而不以為德驅馳四牡首尾三年顧桁楊之久空思松檟而欲掃顯以西部殊愜中心榮擢里閭衣繡何如於衣錦飛挽芻粟養兵不外於養民要使二者之適其中或於初焉而卜所處討論有素施設可知關中給軍糧雖似屈酇侯之重冡宰制國用要何害周公之清所行固有後先其業均為逺大某結交雖晚荷愛惟深屬聞報之已遲恐餞行之莫逮錢流地上竚䇿木牛流馬之勳粟移河東喜借山玉淵珠之潤代廣東帥通廣西漕到任啓九重遣使出觀五管之風三命申恩仰見一人之眷軺音俶至臺事鼎新幸聫嶺表之遊敢贊門䦨之喜恭惟某官才將以德學世其家經術精深繼泰山先生已絶之統文章俊逸下紹興尚書未到之工聲華久播於搢紳步武合登於閶闔直指固由於親擢南遊亦近於斜飛自東至西雖餘千里道途之邈以閩視粵豈有百城風物之煩是謂自卑而升髙毋云以逺而易近况綿歷之已熟何將輸之足勞區區粟挽而芻飛往往絃鳴而鴈落行上木牛之效南海澄清竚歸金馬之居北辰密邇它時竹帛所載竊意權輿於今某専閫無功餘光是賴錢流地上富民遄聽於封侯粟移河東鄰國庶免於為壑代使長馬少卿回廣西林轉運判官啓當路知音列上牧民之最公朝懋賞晋膺遣使之華祗拜新榮回瞻故治所識草木亦先光輝恭惟某官踐揚有聲操履無玷施設發於持滿聲華日以增髙佩綰左符留餘恩於已去之後轉輸上䇿卜成效於未試之初視事幾何聞風悚甚更能持以不倦必當卓然可觀雖近功非逺業所關然外計乃中除之漸竚膺急詔入踐華途某嘗幸同寮後欣聫部錢流地上雅知游刃之餘粟移河東密藉富鄰之潤通廣東提刑吳大卿啓一賢入耳再紀關心墨綬兹來何幸際乘軺之始繡衣它出未遑躬負弩於前喜初至於失眠懼復為之欲汗兩紛交奪朋素小遲恭惟某官秉彛不羣潔矩有道悠然雋味得於經史子集之中爛其雄文發於碑銘記序之內揆以古而合施於時也宜朝廷羽儀王度黼黻小却猶合內相之任方諧物期上卿不為左遷之官未與人稱枘方難入材大莫容與其枉尺而直尋寧若屈身而伸道彼退此進燈火十年之功小窮大通簡編千載之業論久復定恩優如初鵬怒如飛視草蓋分內之事鴻漸於陸觀風且嶠南之遊綿亘二十一州縱橫三千餘里華輶所歷竒觀之多山嵒養於虛豁如顔子石筍立於獨挺若伯夷至止發揮歸歟收拾凡是馬遷所感慨一於史記而吐傾比初述而更髙為後傳也必逺某不足受道未忘學文攻苦無功逐貧不去三百人進士之末二十載選人之中置散日多淫思風月養慵年久疾視米鹽恩與升朝法應宰縣雖曰貴於撫摩耳其如責以辦治何何况直鈎非宜於釣所至竭澤孰可以漁浙視江而猶難廣校湖而差易容堪措手猥用投身獄訟希疏曽未桁楊之卧臺評密邇豈無牒牘之移亮其無它恕所不及俾安南國之跡當盡子民之心退食之餘讀書而已松林無事何當得雄著傑作而編之桂管有詩猶可續名山大川所藏者儻容附見庶獲流聞代人賀洪閣學除內翰啓解直延閣升華玉堂雖文聲素髙當居詔誥之任然恩數特異實擅搢紳之榮郵報四傳輿情胥愜竊以禁林清選天子私人賁時華國之文固須大手引誼格君之職更要真儒况侍燕閒每承顧問隂贊萬機之决誠為二府之儲何俟上臺方資燮理始稱內相已藉經綸惟才學器識之兼全庶文章事業之俱到恭惟某官妙得父兄之授志惟聖賢之歸加以薰酣至於成熟鄴侯三萬卷涌在筆端吏部二百年推為盟主曩居青瑣獨對紫薇代王一言之間增國九鼎之重比還朝列平擢史官雖云汗簡之傳繫人榮辱孰若黃麻之草關國重輕付之老成僉所厭服某慕用久矣傳聞欣然惟前此之名公多繇兹而大拜院中驚見猶未為令狐綯之光門下平章始可為李德裕之賀賀留樞密啓解慎坤維留登樞管恩等執政非徒擅上澤三世之榮身居當途又可為下光千載之業士類驚聞而增氣國人喜至而破顔惟軍旅尚深沉之機故廟堂建宥密之職尊卑分為四級厥品有差長二俱握五符其權無二况百二山河之半失蓋六十甲子之一周天運既窮則必通國數久竒而將偶版圖故土非為問罪之舉莫能自歸帷幄謀臣不能循常之時容可苟處加之同事僅乃二人房雖方欲與杜而共圖召未必肯為周而久駐一旦忽專其任百端皆仰其成內而進謀决可否於陳平之口外而督戰寄勝負於裴度之身其為責人已重乎在當今誰能勝者恭惟某官才髙不露器大莫涯摩撫蕃宣已窺鎮浮之有餘量論思獻納更卜經逺之無遺謀贑上難搖之聲已能復廣於江西蜀中既驗之䇿豈不可移於天下輿情所期者如此聖意其出於是耶報至國門詔司兵柄自從槖平升二府尋常典文之皆然才賜環徑入副樞二十年間之未有其為際㑹可謂闊希然眷厚則責望不輕而感深則答酬未易陸贄無籌之不效始可報君武侯有志而未伸甫能逃議彼王導謝安之懶計殆方叔召虎之罪人要恢君父之廟謨共雪祖宗之宿憤兵猶可練將實難求紹興兜鍪之舊人幸而未死則亦老矣乾道毬馬之新進非有所援其多訾歟裔緒顯微歷資深淺是皆不足多較莫若一無所拘得其材能雖拔於小校下走可也負大智略毋苛以曲亷細謹責之未聞已虛其心而衆不孚安有人百其勇而事難集任百搖勿移一定之力縱小阻無害大疑之勳此理灼然我公信否某誤蒙知已喜得除音賀客莫非諛意者初喜而終厭門生何容隱宜乎人頌而我規中心已見於前言末論敢申其餘意人惟鄧禹是附非舉才孰從而慰存上以留侯相期須决勝斯可以稱塞拳拳之素喋喋奚殫代潘帥賀周丞相啓拜恩天陛升位鼎司獨冠樞躔久篤宸衷之眷分持魁柄始諧天下之心聞風爭傳舉國相慶洪惟今上敻出古初聰明有得於生知邪正不容以形遁百僚庶尹擇人每猶難之三公九卿注意從可知矣自繼明已餘兩紀凡論相何翅十公其間得賢固不云乏所許立事曽未之償故自比年尤加遴選非雅負過人之器豈輕容秉國之鈞恭惟某官忠勞兩朝夷險一節初排權幸嬰鱗敢前再入班行張膽如故兹皆由學問而發所以致聲華之歸荷槖玉堂愈重廷紳之望密機宥命端為宰席之儲幾聞閧傳今果真拜雖臯視禹而有間然房非杜則莫籌衆正之路既開太平之基斯立某受知已厚借芘復多久苦肺經之重昏忽聞郵報而差醒望平津之東閣猶阻造前解漢守之左符敢煩致曲賀仍有請僣實莫文賀周丞相啓榮奉制麻顯登揆席斡旋樞極遐衝寖折於密勿之中掌握宰衡公道頓伸於平章之始恩拜一日慶關百年竊以廊廟有所設施搢紳謂之造化億兆衆安危所係二三公可否之間設若胸中猶未似天地之大措之天下孰非干隂陽之和適是方今之難殊非曩者之比由來國步迭相盛衰粵在靖康百二山河之半失再逢丁未六十甲子之一周雖至數未易以竒耦推然常理容可以乘除卜物窮當變天定必回况漢德無不思之民而敵人有可襲之釁左賢王右賢王爭立之怨當自相攻前將軍後將軍並發之機豈宜少緩𬗟惟上意雅在中原事雖分委於羣才功實責成於兩相內而修政列辟惟武侯率以忠勤外而董帥三軍視裴度為之勇怯敢負重任非循常人恭惟某官得委和所鍾為致逺之器連收科級率以上文章道學而獨優兩入班行皆因排近戚幸臣而輒出方當甘於投散地已料可以為貴人改元淳熙復位侍從滿意田千秋之對立可封侯安知張九齡之還尚煩視草更歷二府遲回七年幾虛爰立之傳今果具瞻之慰自一命纍升於一品悉膺內除由三館直至於三公皆擅清選眷如此厚公若為酬江左以來不翅二百年之久河南之外未取一塊土以歸誰非駕說於天時曽莫歸尤於人事六朝已失今日何懲為國計莫出於用人得士心無先於虛已專援親舊固無以擴大公至正之門必逺嫌疑恐未免為曲亷小謹之道謝安石之舉姪為上將源乾曜之黜男為外官顧何拘之有哉惟其是而已矣凡百事機之豫奪一視理道而從違我二輔臣無苟容心於上彼百執事敢不努力而前一意主張而勿搖十年恢復而可必報君無未了之事歸老有可言於人某聞報增歡撫懷過慮調鼎不能無忌於水火之攸激和羮安得有嫌於鹽梅之相資儻俱不言空為趙憬賈忱之更遜寧小有異奚害姚崇宋璟之同歸推此一心形於四海迄致泰平之極治始為燮理之全功至若疏庸甘於潦倒薦人至二千石想不欲犯移權之名除吏幾八百貟卒未敢為挾故之請夫前所告蓋出於忠代人賀韓户部除兵部兼知臨安府啓版曹奏效黼座疏恩改服夏官似用平遷之典就開京府實膺隆寄之榮孚號一頒師言胥悅伏惟某官貴家令胄明世偉人藍綬效官蚤值功名之㑹黑頭遇主遄登侍從之班試以浩繁投之倉卒刀有餘刃目無全牛人疑未究其長才上謂猶堪於巨用帥閫首推於大尹難得其人國威全寄於重兵孰尸其籍一身二任前輩罕能唐朝中葉以還吳湊一人而已執事今分其美闔朝皆歎其公趙廣漢得民心行為京兆之治最楊宏禮知軍務上繼越公之家聲某慕名積有年聞報不勝喜長安見日亟上九天之梯尚書植槐端為兩地之兆將來所賀復大於今
