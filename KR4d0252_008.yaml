body:
  text: 緣督集卷八宋曽丰撰七言律詩江水出峽衢婺徽嚴水固豪其如所至與山遭當難進處雖回避到不平時輒怒號出峽衝開崖腳闊迎潮激起浪頭高乘風終作歸墟去略湧三山駕六鰲慶元改元浦城桑田大稔余按視次告父老農桑初軫素餐憂幸爾天然大有秋壯穗凝鎌黃䆉稏柔絲滑杼白綢繆黎明婦女放雞犬薄暮兒童歸馬牛飽暖自聊毋背本輕肥相尚莫隨流丙辰十月風日積暖浙間花卉俱開廣中冬氣作春蒸浙土如之得我驚桃李猖狂爭竊發昆蟲齷齪學微行向南栁可為先進投北梅猶是後生物理乘除自相補速成未必似遲成冬晴一晴初已涉秋殘晴到冬深興未闌不雨雪空聊爾濕無霜風自甚哉寒出乘氣末羣陰亂歸抱精元萬物安深想莫如堅坐是還家毋更負蒲團頽春涉途曽謂東風意向偏也從僻處放春妍山山長草青無間樹樹成陰緑不專黠獸幽居疑辟地俊禽高舉欲登天物情不一吾何擇出處升沉任自然題李達先靜暉軒瀟灑一區山四圍朱簾高捲晝陰移三竿已上其誰報一線初長也自知鼓腹曬書春拍拍蓬頭晞髮暖垂垂晴窗大得忘機趣渴爵窺盆更不疑江路見梅懷泉臺留主宰王提幹强號梅為自在春淡粧貴不失天真園林爛漫空多事籬落伶俜倒出塵無竹無松自風韻得江得月更精神清高惟雪可相配次有冰臺兩玉人呈羅春信受命鍾材不已凉未論道德與文章晚謀事事成迂叟羇跡年年是漫郎鋭意向前旋磨蟻灰心求退觸籓羊車中幸有司南柄試與迷途指大方寄臨汀推官伯壽二首解官赴調出臨川倒指侵尋十二年文學背時招白眼功名迂路得華顛胸中要與天相似分內姑安理自然素業更須頻㸃檢有無可以上青編都下燈前别酒闌我歸江國子閩關鯉魚不送書來去蝴蝶猶將夢往還抵掌伊吾灰壯念折腰彭澤汗衰顔十年以後來相問收拾俸餘歸買山庚戌長至稚子杓覔詩賦一篇以警之藝藝草木色方枯坱坱乾坤氣又噓凋嵗似吾華髮後稚陽如子妙齡初冬寒乍暖宜磨墨日短初長好讀書一字未之曾究竟百年何者是權輿過嚴關誓不南遊今復遊東西雖異等南州妻兒纍已何人免行止關天不自由伏櫪過陂從野馬乘流遇坎任虛舟嚴關猿鳥休相笑更過梅關笑却羞再與鼎臣遊龍門寺初嘆來遊未必重等閒十載又相逢壁間古跡塵輕涴物外初心病暗攻坐上酒生冬暖意簷前梅弄歲寒容半酣僧不須烹茗自有山雲可蕩胸赴瓊州次大蓼灘風雨交作寒未艾也其勢欲雪僕僕漫郎蹤跡孤星星迂叟髮毛踈三千里外辭鄉後十八灘前問宿初山未容雲思底麗風猶與雪議權輿有蒲團在不能享吾䇿從今悔讀書挈家隨牒一陽初視險如夷舟當車贑石罅中魚路寢楚天包處鴈蘧廬木無棄本藏於密江不辭流受以虛萬物外吾詩者少惜乎南燕久歸歟過快閣一回艤艦一翛然境界非凡人是仙山似平沉低吐月江如倒激仰吞天宜州乃事一朝去快閣之詩千古傳正恐癡兒小癡爾大癡身自與名全豫未遊碧落洞庚申舟行欲再遊不果竒觀曽邀我命車回車人問景何如山經盤古穿窬後水據𤣥冥漏泄初勝跡遺留榮利後塵心昭雪市朝餘重來雲霧不容入魚鳥相嗔太闊踈昨與豫遊如陳廣元張壽卿江伯記陳通卿皆已上計矣獨鄒用之鄧繼高猶困厄况今相去愈逺緬焉懷思因成兩詩各書一通寄之枕中肘後為渠空效驗如何小不同失馬安知非後福獲麟未必不終窮紀昌已費二年學造父猶爭三日功了却酸辛殘事業從教運塞與時通章貢三年兩到休况今又落最南州思君梅嶺不遮夢惜别葛溪猶漲愁子為坐窮知理道吾從遭病憶交遊明年肯為槐花出來看海瀕天盡頭南海祠東海中有小山可著屋賦詩海裏山巔著數椽舂容仰止已翛然仙家自我有方丈沙界從今無大千萬物長春天不夜清風莫逆月忘年神遊不制夢回興未了君臣父子緣題南海神祠前觀瀾亭巨靈開闢遺遐觀沙界之瀕碧所環外國連天疑信裏前山㸃地有無間眼隨羣有自起滅心與太虛相往還至止歸歟何所得心猶有剩覺空慳宿南海神祠東廊候月烹茶吹笛祠宇沈沈海岸頭况逢冷夜耿清秋風前塵外笛三弄飯後月中茶一甌借我孤舟隨水住乘時一棹與天浮舊談八月流槎事豈料今來傍女牛送劉薰卿未曽得俊利名場猶敢犯危煙瘴鄉大庾嶺高梅挺拔東莞天逺海汪洋其凡飽以史收拾所異剛於詩主張歸數羣雄可雌視騏驎誰得擬康莊四月解官渡海陸出北流置舟在南雄又陸出擬于小春到家歸心如矢路如弓坐兀輕車又短篷百爾動搖山特立千斯窒礙水旁通往哉火倒西流影行矣霜回北至風細數離官到家日一年强半在途中歸途值去客歲晚乾坤閉未開地中方蟄振天雷山雲已覺成輕出塞鴈何為獨逺來失學齊侯隨馬去甘為墨子叱車回從今行止休多問有尼安知不有推自廣至永豐呈熊直卿鄒用之鄧繼高斷梗歸從南海邉絶長補短恰三年聲音幸未移蠻氣鬚鬢疑猶帶瘴煙走俗抗塵吾老矣吟風弄月子超然褐袍可著終須脫鐵研雖穿請更研解官歸至永豐繼善伯熊寶臣敦禮昆仲皆化去新自梅關返葛溪天心不與我心違市塵城郭依元在親戚交遊過半非紙上銜猶仍舊署腰間帶已减初圍候門童稚倚廬老幸不空教賦式微北歸至廬陵過州學前記認舊遊嘆同舍之半不在也久落殊鄉今始回學門未改舊崔嵬交遊髭鬢緑成白齊館簷楹朱上煤同舍無多登仕路連年已半入泉臺閽人怪我面塵土不道功名心亦灰北歸見攝徐聞邑大夫乃舊同官邵雩都之子為賦詩叙契贛邑交遊十大夫忘情詩酒邵雩都薾雲矯矯新龍友栖竹亭亭舊鳯雛燕馬北歸灰晚念海鵬南運壯初圖由來後好今分付車笠重盟幸勿渝自廣歸至南康與蔡承之黎夏卿劉成叟相見轉蓬隨牒入畨禺中土交遊愈見踈嶺隔不容南至鴈水分無復北來魚往還一介動千里終始三年才兩書所賴清風與明月時將吾夢到君廬辛酉冬罷歸至家自省彼哉言者固云云老矣歸歟敢自文不可以風霜後葉何傷于月雨餘雲性情與物常為一鷗鷺容吾便入羣古道從來得今笑天相知外任紛紛觸物無我那虞物所侵從教物與我相尋雲頭翻墨任濃淡山頂潑藍隨淺深春色若空疑有著天工雖巧實無心可憐杜宇空多淚更笑黃鸝强好音窮冬征途觸目省身青陽用事到𤣥冥萬彚營營幸歲成霜雪不仁偏嗜殺松筠有道喜含生巢居凍鵲常高遁血食飢鷹輒下爭自反吾身不攖物懸知物亦不吾攖深冬積暖乍寒冬令將終尚未霜伏陰猶强遜愆陽連旬逗暖日驕放半夜邀寒風怒張蟲不開關平引退木無背本穩歸藏道消固自有時長世事那由得汝忙赴康州有感辟書未上意躊躇蠻障無望車騎都允矣曲從人慫恿往哉聊避鬼揶揄來鴻告至其欺我去燕辭行蓋啓豫南驥厭嘶自懷土東思初不待蓴鱸至德慶崖下回想松江山江灣一轉一重山自入江來幾轉灣檄到如風心倥偬船行似箭眼斕斑三場題目那容緩一切工夫未得閒夾岸青峯可相約黃花前後待吾還德慶府城繞以荷池葉楙花繁時環望之紅緑兩無間斷號為荷城記以唐律遺後來使君中置金城外玉池池荷挺拔紉芳菲葉爭以緑環三匝花逞其紅曵四圍龍國繢人供佛坐蛟宫縫氏獻仙衣使君未佛且仙去紫槖朝真紅炬歸假守晉康出郊勸農笑下籃輿上畫船百年詩具已遮前川通諸海滔滔是魚躍于淵圉圉然雲出山頭猶閣雨風行水面不停煙囊中隨意亂收拾容了勸農歸細編小隊近郊初省春杯盤綿蕝意殷勤叮嚀通國老和少黽勉及時耕又耘賣劒爾行移爾俗買山吾退了吾文試於農譜相尋認果是康州舊使君郡齊與龔濟叔劉薰卿談詩其奈魚蟲草木何詩之機械也無多氣猶動志平心養聲可成文泛口哦𤣥酒太羮君子淡蕢桴土鼓聖人和鬼神天地與吾一相感相通豈在他二月三日至薌山寺劉薰卿在焉置身松下已忘塵况在松之上置身荒壘中盤平卧斗澄江外抱曲拖紳春熙天色如初醉煙肅山容若半顰晉郡猶餘晉時事幽人疑是避秦人廣州登蓋海樓他求無可洗塵勞蓋海樓餘百尺高十萬人煙城繚繞三千世界水周遭偏於物外有雙眼正以胸中無一毫非與海鷗强相入海鷗無自是吾曹天妃祠戊辰閏月晉康久不雨禱于聖妃諸祠拜罷雨大作連日沾洽賦詩志喜兩鬢閒時為國蒼况乘五馬小騰驤方當赤地頞皆顣敢據黃堂心獨凉雷雨影從千里快犂鋤毛起一時忙少寬漢郡守丞責幸不空餐粟一囊歲在已未與南康宰周丈君可相别至戊辰復㑹于晉康次所惠韻謝之君詩莫把與同年絶岸孤峯自一邉氣質乾坤方判後規摹風雅未刪前想思鑒裏縻旬歲自祕囊中擘一篇留與江西為後社子孫不敢作私傳增城丞嘉禾張元輔才過郡輒去未及欵曲也已而同校藝晉康易學淵源出義方緒餘猶作漢文章名高未及蓬萊島心逺寧輕鴈鶩行紙尾固無勳可䇿松間殊有味難忘諸公論薦休聞早且候珠璣滿一囊隨牒相逢瘴海邉經從不為小留連藍田晝短子姑去彭澤春濃我欲眠近境曽無携具日殊鄉却有對床緣天知道大話長意借我黃花節以前閒居幽步歸歟無可答休休小放吾心與目流山不去門如自售雲無留意似他求有如許柏得能古都幾何松若箇幽更有疏梅修竹在其他莫與子孫謀桂樓重屋崢嶸据道周浪行良倦小淹留星無匿彩天澄夜雲不遺瑕月粲秋金氣方張猶重殺物華已結未多收老來姑置行藏事寫盡襟懷獨倚樓李叔度與兒曹談道理余竊聽而記以一詩天地未分先立經自吾道外豈常行伊周孔子直方大堯舜文王純粹精新犢生時無次剩白牛熟後可縱橫有言終與一為二豫欲無言是混成方罹殘熱忽值新凉喜而賦反悲秋晴宵如浸晝如蒸變氣知從激處生風不相饒乘木敗火猶自負與金爭纎阿洗月為純白少皥澄天作太清宋玉所悲吾所喜長哦聊復發秋聲道傍有松為人所刳伐因自弔且慰焉秋時蔚蔚老槮槮羞與其他木作林獨以高風資衆望終為明德纍初心不容節抗皇天峻猶幸根盤后土深自有茯苓堪自壽願言黃帝勿幽尋五言排律上浙東帥王尚書希吕字仲行太古犧媧氏創為琴與笙氤氲弸混沌噢咻擘冥莖合氣歸三律分音麗五行未歌先協律無韻不成聲曲度初焉刌詩機寖以萌朝廷風化洽里巷頌聲盈𤣥鳥三夫倡卿雲百辟賡口姑隨所發心自得其平三代德為政四詩辭見情揫收歸禮義㸃檢中章程傳久寧無雜刪多亦已精王通續似贅束晳補疑贏聖事難為僭時名可與爭道人中曠絶樂府四紛更體變從蘇李枝分入遜鏗舂容七字律挺拔五言城老杜收全氣新功集大成統經唐末亂𣲖轉國初清歐定聖俞價蘇成山谷名江西容入社天下指為榮顧我耽餘習如今費半生閒中無益作醉裏不平鳴改罷令兒誦吟成喚客評槁肝隨血嘔枵腹缺書撐亂藁囊成癭狂題壁被黥捫心終鹿鹿掩俗强錚錚要得誰然否能為我重輕宗風晉王導詩學漢匡衡廢食毛錐子忘年墨客卿風騷潛出入古律恣縱橫造化隨機掇江山與筆攖千年傳有嫡四海敵無勍妙韻驅三籟徽音逼六䪫何當被金石直可薦宗祊宿傑饒先駕新英聽主盟聞韶醒耳閼慕藺倒心旌傴僂循涯進殷勤曵蹤迎觀天醯甕坐持斧郢門呈魚未經燒尾龍猶要㸃睛金箆輕發膜銀海驟增明肯作招風木甘為附驥虻龍門難得到王府不妨傾訖我無嫌富山巖可以盛别陸德隆黃叔萬嵗在辛丑始識陸德隆黃叔萬於江西帥辛大坐上握手論交而去戊申又㑹于中都德隆得倅䕫叔萬得宰公安言别次課贈之辛丑隨浮梗鍾陵得盍簮潛蕃門若市斂板客如林氣宇黃陂闊詞源陸海深二豪談正劇一坐口俱瘖詩社初容入交盟後失尋雲山千里眼鑒寐八年心九陌迎連璧孤燈話斷金始猶疑面目徐復記聲音蝦菜隨宜簇茅柴取意斟行藏更見告文行互相針憤敵常旁午憂時半孔壬清風晨揖袂明月夕離襟發纜東流岸回檣倒景岑荆江隨地卷蜀道與天侵通守諸侯土專彈百里琴長才優撫字暇日少登臨隱士隆中卧羇臣澤畔吟青城山鬱積赤壁樹陰森哀樂歸巴曲興亡入楚砧把杯空弔古搔首重傷今擁户鋒車急開緘詔墨淋擡頭高拱斗别手上捫參可畫安邉䇿無韜活國針寸心丹未了雙鬢白那禁顧我傷彊矯從今判陸沉磨礱閒筆研摹寫亂魚禽氣反風騷朴聲收鄭衛淫吾伊樵道上欵乃釣磯陰拔茹終無忘彈冠老不任移書相答謝吾突誓長黔贈别滕州法曹南劔張仲明天上張公子名家更好修文章虹貫日意氣鶚橫秋桃李春風發桑榆晚景收丹心猶似在素業未容休黃卷堆胸次青雲出筆頭少迂蓬島步聊作嶺南遊穩口開三語平心活一州陰功終有報㑹見襲封留送五羊曽仲卿改秩受縣南歸近𣲖家于粵初封國自鄫要無非我族終不是它曽閲譜宗盟重聨官事契增居常多阻間僅獲一瞻承逆旅重交臂高談屢撫膺秋風樓上月雨夜案頭燈把酒相兄弟論文復友朋衆星朝北斗羣翼讓南鵬墨綬恩光爛花城喜氣蒸宜民條教出溢耳頌聲騰鶚牘交飛上鸞臺緩步登難中須有立妙處要無稱顧我羞低首從今樂曲肱未忘為吏隱猶學在家僧念舊寧無感馳書恐不能官高餘健走可遣到廬陵擬試以蟲鳴秋大化轉無休蟲那得自由暗中誰擘口閒裏共鳴秋氣感蟾蜍冷聲歸蟋蟀愁幽閨勤杼柚逺塞急衾裘豈不便鉗口而猶强出頭呶呶竟無益也勝喚晴鳩五言絶句方稚川恕齊五絶求仁亦多途取近惟一路內恕以及人知君用心處安宅曠弗居浪自分彼已儻由恕門歸天下一人耳此道固非淺聖門兩三人佳名長在眼無實勿為賓一心貫羣倫乃是吾祖事耳孫不繩武愧子兩大字視後而著鞭書此以自警一言行終身要處君已領寄內已復山上山何當口中口寫兹秋下心寄我女邉帚七言絶句眇空閣妙山孫元濟建閣江瀕以館往來士大夫余取韓文公瞰臨眇空闊之句題以眇空賦三絶句萬里江山繞畫欄要猶未離色塵間眼高更不著羣有獨與太空相往還未慣觀空空可觀更參向上一機關大通與我合為一眼自有餘空自慳真空元在我胸中自外觀之枉費功孰是主人參透處也無實相也無空值侯修學趣儒人稍急因遺蓮花蓮實西瓜於吾宗翔叔作詩以勉之絳玉裁花碧玉莖亭亭香逺韻逾清羣仙競倚西風笑為報臨淮政已成珠房顆顆緑英英興味超然芹藻馨不必鐵槌撾碎却苦心應念子襟青紺色毬兒護水晶味甘如蜜冷如冰香風飄滿葵丘戍散與梟林解鬱蒸道旁松撼雨號風太古音道中豈作買臣吟火雲蒸雨無逃處乞與行人數畝陰題悟性寺卧雲堂呈源上人三首僧與白雲同住山夢同雲出覺同還勿移枕席下堂去堂下吾疑是世間一片閒雲逗半空僧間况復與雲同夢中不問華胥路直出無何入大通渠儂高卧傲吾徒不道吾徒反傲渠渠不得雲無卧處吾元自與太空俱試宜黃侯湛墨跨竈傳家祖赤松吹煙授道悟元宗初懷不擬潘衡貢晚趨寧便薛稷封逢時不敢愛𤣥香摹寫堯文畫舜章天地已歸經緯裏豹囊深處自含光通濟橋何年彼岸幻長虹接引羣生入大通彼此東來無間斷度人了後勿論功通往通來無四旁津梁未必不相妨吾行拗折橋梁柱盡放途人蹈大方題水牯庵堯自牽羊舜著鞭雖勞未必適羊天君今馴養犢成牯飽卧太虛遊自然三十餘年不踏泥其如猶有角和蹄何當紀渻重馴養四十日間如木雞留别金陵故舊公家事畢更何為回眷錢塘臂欲飛留客故人雖意厚倚門有母待兒歸次韻楊誠齊雪中夜閉袁門晏未開開門滿目是瓊瑰木綿著地還飛起栁絮沾人倒撲回雪兒初是玉仙妃謫墮人間尚縞衣撲地狂風相衮起疑乘白鶴刺天飛次韻酬姜邦傑雪中見寄十人賦分九窮寒古說天慳今不慳一夜盡開多寶藏施銀為地玉為山秦望山六國英雄已坐擒更何所望此登臨真成馭鶴乘鸞去未愜秦皇好大心鋭意秦皇初學仙要和雞犬也升天那知身與鮑俱臭嬴氏炊寒不復煙代墨客卿自賦贈安城彭雲翼决䇿初如媚竈然觸機融理悟吹煙從教時尚白之白自與道俱𤣥又𤣥同為時用楮先生萬事須臾㸃化成寄語先生幸相避不須白黑太分明贈筆工周永年豈無毫忽補于時用盡初心卒見遺不拔一毛徒自利楊朱作計未全癡初心聊欲以文鳴開國何曽夢管城借不中書非所歉秋毫元重泰山輕寄題張子登遂勤齊一字于吾補不㑹詩書况味冷如冰誰家以此為長䇿不把其它易短檠鍾鼎軒裳眼應白餘猶要得聖賢力意誠身正一家齊門中自有華胥國太平老豁庵父母胞胎未結前趙州識後笑南泉豁然道與虛空似不道虛空似豁然道旁梅本隨驛使上長安非到中途意便闌為念征夫行旅苦與生滿舌繞牙酸
