body:
  text: 緣督集卷一宋曾丰撰賦桂巖賦并序運使馬少卿于聽事之東葺故屋為宴坐所疊石為山植桂其下揭曰桂巖賦為發揚妙致作也陽星之精奔入于月故月窟無凡植橠桂樹之婆娑夜影耿兮澄徹月桂之種下墮于粵故粵壤無凡茁蓊桂嶺之蔥蒼秋香撲兮清絶桂嶺之别是為羅浮下有巖兮谽谺上有桂兮崒􅍶花縞縞兮粲夜葉茸茸兮鬱秋小言之廣東之蓬島大言之江南之瀛洲有偉兮異境孰移置兮公之屏天花開於逡巡石笋拔乎俄頃不墨不素寫出月中之真非水非鏡照見天上之影豈公身遊月宫手嗅桂華心欲得之而植于家決鼻銜其核望舒擢其芽授之使歸種為生涯者邪曰不然公有斧修月莫指其痕公有石補天莫捫其罅連根斫桂端乘修月之餘平地起山亦出補天之暇元勳尚爾其少稽妙用輒茲其豫借左擘天台之崖右搴合浦之溠斬雲骨與煙苗幻風軒與雨榭五丁猶服其敏強六子不辨其真假決鼻望舒公何彼藉或曰岱輿之嶺羽人所舍厥植有桂其鬻無價子纍纍兮雌珠而牝璣香馝馝兮僕蘭而奴麝公聞之圖詣覓觀懼成枉駕叱夸娥兮疾趨麾禺強兮橫跨挾彼岱輿而西頓于牆壁之下夫如是則盤古公徒巨靈公亞山川繇我而峙流草木自吾而榮謝凡囿氣形率歸造化夫修月與補天又特公之細者也雖然至人無我大道同流寓意出機猶未免混沌之鑿反身內景得無損汗漫之遊蓋摸索公之胸次自有一壑與一邱了知假合誠是贅疣聊復當丸弄而竿戲豈真為蜩掇而瓦摳繼自今扶天柱於無底絙地維於不周舉首戴山之力大試橫身負河之志畢酬厭紫府而思凡告玉皇而歸休親戚故舊勞苦咨諏公其倒羅浮於囊中傾岱輿於筆頭以示之謂吾生宦遊之所滿拾而飽收者如此而已若其笑乎否哉海柏賦壽益公南極清老人明稅層霄墜重溟化作石質流為柏形軀蕞爾兮傝􅳇氣浩然兮崢嶸天兮降材帝饒兮豫齡得喬松兮稱弟與大椿兮爭兄甲子相忘曾何有于寒暑乾坤自大胡為乎厭薄我蓬瀛踽踽然從下士以求介紹謀與上公而為朋哉公眂柏柏眂星蘭臭氣味歲寒典型體不同而道合貌未接而神迎柏遇主人兮眉黃公獲良晤兮眼青契若疇昔歡如平生謁平園兮不獨往問訊華隱兮先登方將及身之孤髙乘足之雙輕駕翛翛馭泠泠相襲籋而上青冥也坐客俱驚起攬公纓非岨輕舉有衰老成何當肯留上為朝廷之重下為州里之榮公徇客兮以情客壽公兮以誠有木名榆受氣玉衡亶哉彼柏星氣蒸也惟鍾于柏物中之亭亭故鍾于公人中之錚錚有士姓李受氣長庚亶哉我公星氣凝也惟公于星蓋星之精故公於人乃人之英泥丸丹田與造化爭却老逃艾還孩反嬰華胥之城空同之坰恬寢愈興娛坐嬉行忘其為長生墨竹賦中都員光祖所寫我家江南種竹繞屋兹僑于京無竹而俗欣見員郎吐墨為竹不根而萌不笋而莖盤礴之頃天生地成不籜而節不苞而葉逡巡之間神造鬼設謂春滋邪外萎其形謂冬凋邪中益其精瀟瀟瑟瑟濛濛溟溟未霧露兮如濕無風雨兮若聲顧壁間數竿之可意與渭上千畝而爭清拔我汨汨納諸泠泠府寺之迹既涴而復潔利名之骨久醉而忽醒惟竹太孤孰同保社鳯馴栖而思凝鶴矯立而神化有固可嘉無奚足訝所少七賢坐於其下七賢面目今莫識者視我形骸隨意而寫置之竹間以伴瀟灑毋謂今人之不古安知真相之非假蠧書魚賦嗟嗟曾子貧哉其家猗富哉其書粵昔走帝鄉而干祿猗爰豫書猗作踈棄而去去而歸猗匝半期其有餘一日發笈出書猗手欲披而莫扶糊偕楮浸腐猗陰濕猗茁菰楮偕縫兩不相屬猗字畫猗豫俱詰其蠧吾書誰猗有物焉曰魚乎魚而前猗訊問其辜曰微乎女之貌眇乎女之軀爪牙猗匪豹匪貙角觜猗匪鼷匪鼩胡為乎敢爾齧吾之楮啖吾之糊寖而蟊賊吾孔孟之遺訓堯舜之典謨按三尺與九章猗擢髮不足數女之罪顧女蕞然之形猗蓋不勝誅余將淬劍以戮女女其何辭以對余若其辭耶則開女以自新之途不則決不貸女之命於須臾魚也哀而乞憐曰公且息一時之怒待吾盡其情以訴倘其自飾以遊詞然後伏公之刀鋸初吾之營營猗非為口腹之故蓋聞仁義之勝乎膏粱猗可以供吾之啜哺故潛身入其間猗欲求其饜飫奈何哉其口不識味猗翻為書之蠧雖然吾獨小蠧爾不幸為公擒尚有大蠧焉公胡不之慮曾子驚曰今安在哉吾其往捕曰其來也代久歲深其衆也雲屯蟻聚粵自孔墻失護厥徒橫騖瀰茫其正路出入其異户戕穴吾春秋猗斷斷乎公榖之據穿窬吾風雅猗拘拘乎毛鄭之序書猗膠於秦誓易猗梏於象數又其甚者韓非師老剝天下之肌膚李斯事荀壞先王之法度信夫千里之差初者起於跬步不然胡不見墨子悲絲莫知所措楊朱泣岐傍偟四顧原二子之初心豈欲無君無父也耶由是觀之蠧公之書彼蓋其尤者也公不鋤而去而獨歸咎於我何歟縱云在我蓋出於誤於法猗當誅於情猗可恕曽子聞而驚曰吁女之不幸猗至此哉宜其為人之憎惡安得聖人出而針其受病之處昔者嘗聞原壤之弊也必至於為晉為梁故孔子為之拔其根之固師商之弊也必至於為楊為墨故孔子為之開其所未喻嗟女蠧書魚猗惜乎不孔子之遇顧我雖非孔子猗焉忍坐視其僵仆爾蠧書魚來吾語女道學有捷法聖門有真趣軻也豈盡信乎書參乎惟一唯之悟繼今而􅉨爾能糟粕之捐猗醇全之茹則不惟前非之可贖猗自得之學云庶不然豈獨為人之憎惡而已哉甚則又重遭其擊抪也魚謝而退曾子歸而嘆曰悲哉魚之蠧吾書也不過乎文字之殘人之為魚也併豫其道之斁吾為之懼故為之賦楚詞祀蠶先并序人以蠶兮為衣蠶以桑兮為糧柞樗棘欒豈無葉兮可食之今蠶嗅矣訖不嘗是以未即治蠶先期治桑或問蠶祖則曰園客之妻吳縣之婦抑嘗考之赤帝之女學道得仙巢于桑樹憑桑而靈享蠶者胙夫人生理繫桑與農寒衣兮飢食用異兮功同通郡縣祀稷為於農兮有功彼蠶先雖未廢自后外其孰崇厥功同其祀異幾何不與世之所謂受施而忘報者類大事難乎文拘曠禮可以義起祀彼蠶先由吾家始又從而為聲詩以相傳庶幾遍區夏而皆祀其詞曰旦榖兮辰剛聿蠲衷兮齊以莊孔傴兮再摻擎厥拳兮三迎將飛廉掃兮涴者以清赤松灑兮溽者以涼靈之來嫖嫖兮若翔兮上靈之下婉婉兮若倚兮傍靈之趨躞躞兮若參兮前靈之坐盤盤兮若據兮中央乃陳其太牢侑以兮糜糖糕柔兮膋肉腯鼠腦脆兮糜薌靈其肹只勿虛我佖只世傳沙宅兮亥地泥屋兮壬方棗種南舍風來兮東廂夫是謂兮宜蠶徵其如我教兮未詳顧蠶兮消長惟靈兮弛張紛再登三熟與四出信吉利而蓋故常雅志兮蠶事匪徒製兮已之裝絲吾欲繫象兮俾不折繭吾欲投火兮俾不傷于以試兮允哉驗殆將補兮舜裳靈其炯只勿虛我景只蛹有種蛾有秧圓嶠兮色黑寒國兮色蒼絲一指兮大繭一尺兮長蠶有兮彼異何當畀兮千斯箱靈其佽只勿虛我企只乞如願丙午歲首有商叟過余曰如願叟叟嬖醜也逸不知其姓某或曰喜母之女歡伯之婦得自青洪君之手至自彭澤湖之口嫵奉兮叟左婉承兮叟右叟歉兮授以豐叟薄兮授以厚假非玄女橫縱兮坤六倒顛兮乾九安能轉叟之凡百竒為一切耦乎委以赤心期之白首歘於晨興潛以形走門有守户有候其故縱之守候是咎守壘候荼􅌓眙嗟吁奉職警梱曷嘗少踈猶疑未獲未出而廬爰搜爰索乃籲乃呼則趦趦趄趄闖於東窳糢糢糊糊霿於紫姑彼紫姑者能文知書叟不識字勢難動渠公善形容以乞焉彼宜響應以歸歟喜不自禁則節文而為歈曰來紫姑甘有兮松醽糅以兮膠餳紫姑來下盼余馨辛有兮椒醁糅以兮蔥紫姑來下盼余馥淡有兮桃醿糅以兮柏飴紫姑來下盼余馡三薰兮三酹夫有懇兮其敢昧久求如願兮顧茲在幾為余兮割愛來紫姑伊嫠且媰音初凡借顔色饒髭鬚厥有李赤豫讓范雎若乃鬼殘彼非刑餘彼所有若所無緩急自可相須詎必如願而弗以乞余羌紫姑形不露脰而有影若拇殆余授邪羌如願聲不露噣而有響若吽殆余噭邪公其願貴或願富邪貴豈能玉余骨使莫腐富豈能氷余肉使不臭邪文章可傳金石不朽要貴其精須遲以久余心所願汝假之壽應聲似曰有有祀南海神赤精炎官兮神一靈兮幻只鴻澤龎施兮神一念兮胚只上清委照兮神功行兮簡只浩劫彌沙兮神慶休兮綿只太虛窈窕兮神徜徉兮栖只瀕海渺瀰兮神漫浪兮僑只沆􅒭溟涬兮神固自兮飫只肥腯芬薌兮神孰何兮肸只昏頓顓冥兮神惻怛兮矜只顛連號呼兮神恍惚兮聳只焄蒿悽慘兮神憑憑兮下只狎猥媟嬻兮神恢恢兮涵只讄曰蒙兮景只有嘉斯殽兮羅只有旨斯醑兮酹只神兮歆只有皎斯衷兮監只有蹇斯數兮翊只擬雅途歸遭雨有序我歸遭雨為王事也恩重身輕無尤怨之心焉莫豫我食食于公庾我歸遭雨我不以為苦也莫豫我衣衣于公府我歸遭雨我不以為苦也莫豫我居居于公宇我歸遇雨我不以為苦也有粲有序有粲為益公微發也公得玉蘃以其似道而酷愛之人莫窺其意故作是詩焉春風穆穆有粲若鋈音沃獨出者英既亭既矗孰刻之玉公昕玩兮忘春雨涔涔有粲若琳八出者須既挺既參孰點之金公昕玩兮忘簮八表一裏蓋九疇之云爾英須如之亦孔之䔺一中八邊蓋九州之云然英須如之亦孔之葏九疇之中屹其皇極彼孔䔺兮中兮獨屹九州之中巍然王畿彼孔葏兮中兮獨巋中兮者得所傍者得侣主董其臣臣扈其主他華豈不須莫如此都與天地合自然之符他華豈不蘃莫如此微與君臣合自然之理遊仙感止心兮朝真遊貴感止心兮拱辰天豫平園仙愛之璱英左英右幾須卓立公豈不懷嚮為輔弼天豫平園仙愛之瑛英前英後幾須勃興公豈不懷向為疑丞天豫平園仙愛之瓓英奧英茝幾須用奮公豈不懷向為藩翰有銜大恩不忘至尊夢遊魏闕覺在陶門胸中有兮樂國天下無兮平園華徠自北悅公之色公飲酒兮興之於適欲老還童與華同澤華闓自春怡公之神公賦詩兮意發其真陶情歸性與華同純純極兮生白白極兮招浬矯入太素文反於質馴歸太玄白守以黑公同乎造物九月有序壽建公也九于數為老陽老陽應時老人應期自然之符也九月庚庚金風䬝䬝菊之有之強名金精九月庚庚玉露泠泠菊之有之強名玉英精英于菊薄畀其贏公于精英裒其大成精英攸結霜莫之折小字女節公生烈烈精英攸凝霜莫之陵小字女莖公生亭亭女莖曰咄挺其自拔涵濡天渥吾不如女葉女葉曰嗟匽其自奢漸寖天和吾不如女華彼女華者有都其色公所養兮亦孔之澤彼女華者有都其香公所立兮亦孔之芳彼女華者有都其味公所調兮亦孔之旨八月擷葵十月擷梨匪蚤伊遲菊在中兮有神有奇于以却艾寧復云耆八月擷棗十月擷稻匪遲伊蚤菊在中兮有化有造于以却老寧復云耄既浣之後未望之先有誕初辰有秩初筵公呼子孫爾來吾前有觴勿他酭維菊可以酒飲之長壽有釜勿它烹維菊可以羮餐之長生飲少輒酣餐少輒飫公舉其步謂殆神助客攬其屨謂殆仙去惠然肯留永與國為柱公邁何遄有序送大學尚書劉公帥蜀還朝才過家又帥潭也公之西矣蜀人是謠都人是囂詔豫華衮亟哉來朝彩熊既稅彩鷁既發月逗歲遛竣其未達都人曰嘻吾國君師欲猷欲為未得良毗公歸何遲公之東矣蜀人是戀潭人是羡詔豫油幢亟哉往殿列城既傾列騎既迎日裴月徊倘其未行潭人曰噢吾家耋孺不襦不袴莫能略顧公來何暮公之南矣潭人是抔洪人是留議奪朱轓亟哉還休御者既靷餞者既挽俄馳頃驅僄其未返洪人曰嘕吾土山川有真有仙可伴長年公邁何遄公之還有序為有詔以桂帥李公歸作也公之還謂常還兮獨不謂公害著儒冠學其籋矣于聖之關仕其簉矣于鼂之專孰驅我牤兀浙之湍孰駕我熊兀桂之岏交中互外迭來更繁一心若力幾暑且寒于何景逺于此懷安四三皇王效何當完九八元凱志若為闌斯夢斯環兮隮我閶闔之門兮公之還謂常還兮獨不謂公害峩粵冠上意我東南憂誰寬伊素若赤維翰維蕃校妥爾寢氓恬爾餐伊碧若朱維幢維轓外薻曾幾中渠殆單肆是蠻狃申之瘴姦裏之知之寧是弗言上之聽之寧是弗嘆斯賜斯環兮遫我湘漓之干兮公之還謂常還兮獨不謂公害彈鼂冠斯傳于驛尚行于鵷何以居之宰臣曰囏豈無雞舌輔以麋丸于逶于蛇與鼂為羽翰豈無辟水枕以橋門于顒于卬與士為芝蘭天子曰咈唯才是論胡為呼天驥而豢之闌胡為呼隋珠而藉之彈厥居惟閌厥立惟胖斯佩斯還兮畢我鼎彞之殘兮南有刺有序南之竹木草皆有刺也竹之刺利於草木之刺利於竹又有不刺之刺利於木者焉故作是詩也南有刺蓐又有刺竹有刺竹矣無刺蓐矣彼竹何族有刺如簇蹴之者瘃天委去聲彼酷誰使爾蹴爾瘃誰讟達者蹈足恚者仄目斧斤數數自貽伊蝮天道好復況利於竹南有刺竹又有刺木有刺木矣無刺竹矣彼木何族有刺如簇觸之者衄天委去聲彼酷誰使爾觸爾衄誰讟達者鼓腹觸者裂肉斧斤畟畟自貽伊毒天道好復況利於木灕之水有序灕水自興安而西至於桂林又自桂林入于東海灕者離也居官不得行其志思與灕水俱離此以去焉灕之水浮兮粗資以汰灕之水激兮頑資以淬灕之水清兮垢資以灑灕之水潤兮稿資以溉灕者離也胡離乎東而西其會永言西大不渤而匯靡資弗沛四有一逮亦孔之快灕者離也胡離乎西而東其邁永言西隘不颶而瀨靡資弗礙四無一逮亦孔之溉逮固罔功不逮寧罔罪誰謂匪詿又誰謂無悔離哉離哉固云忒哉寧固云憨哉離哉離哉固云夬哉寧固云駾哉續南有樛木有序為有才者進以自纍不若不才者退以自遂作也彼樛者木輪囷其質既幹既跋匪枉伊直時乎倒植自卑自抑膠轕蟠屈形詭貌譎於時好乎弗適彼樛者木擁腫其資既節既枝匪立伊欹時乎倒垂自抑自卑勃窣離竒根恬蒂怡於性元兮弗迷弗適時好暴客不到暴客不到軼出乎危道弗迷性元靈主長存靈主長存馴入乎妙門危道我出妙門我入有謂我為兮不才之物不謂我得兮不才之力續南有嘉魚有序為無實有名又自衒以自戕作也維離之方維丙之穴誰幽爾宅自濡自沫惟性是適與汨俱入莫厝其罬亦孔之點維夏之時維孟之月誰浪爾迹于哺于啜惟物是訹與潏俱出莫稅其罼亦孔之拙天豫之骨其鯁如鯪道與之肉其糜如鯹非媺人口可昌我齡奈何薄味徒爾休聲麴氏傾意漁人動情雖被相欺以機械亦由自暴其神靈彼名有纍兮彼生吾生奚用兮吾名
