body:
  text: 緣督集卷九宋曾丰撰七言絶句隨牒至南康軍呈李宰蹀躞騏驎去路寬西清太冷北門寒且將東觀編摩手來作南康拊字官善刀初不露鋒芒五栁圍門琴臥堂百里桑麻春塞眼四時風月夜搜腸乘閒贏得答江山答了江山未得閒墮淚碑中恩有剩凌煙閣上事猶慳南來摸索子長胸已有東坡獨秀峯再過峯前問魚鳥盡歸陶令錦囊中八月六日送鞏帥郵亭上有時夜燕歸乘月未始晨興出戴星半載初逢迎送事五更已至短長亭呈羅叔異浪把柴扉為客開揖餘茶碗又湯催應門老走忽解意放入江西風月來崆峒不合識東坡驕氣百年猶未磨今放晴煙弄寒影安知非喜子相過吾疑子亦慣乘機乃枉華軒扣竹扉不是梅花不相外囊猶未瘦若為歸出東城門見牧牛出逢村落放牛天浩歎微官久自纒回首未能收白牯歸家猶可養烏犍贈畫工懷玉撙齊一味好哦詩試看傳神筆是非雖得掀髯搜句狀更參㑹意㸃頭機贈廬陵筆工蕭昶作成大小幾毛公妙出毫釐入大通貯霧含雲䇿勳後藏鋒戢穎豹囊中送胡平一赴召六絶豫章名勝二三公分置諫坡樞府中公更歸為吾道重涪翁不得擅宗工汝潁初陪長者游齒牙名理晉風流討論周易開端處涵泳羲皇向上頭學校不興名教衰公其一力主張之三千弟子還初籍六一先生入後碑此邦名分久無之初政專精立等夷與我軍民新耳目還他天地舊尊卑詔歸臺閣侍從容名節相髙氣自雄攘臂何愁難倒海擡頭不畏有頽嵩匪旦參兮伊夕樞收藏名跡不容書史官强立功臣傳房杜無功功有餘送石江曾元英赴太學補吾宗叱馭闖賢關筆湧長江挾泰山餘子望風俱辟易且容瑞豹露文斑萬物不移三百篇得魚固自久忘筌緒餘一醒冬烘眼快著長安得雋鞭中都之嘉會門陳亦顔為堂曰城南書院取韓昌黎公符讀書意也買宅猶難況買鄰一區判與九衢瀕那知萬壑千巖性不受高車駟馬塵寧開白眼視公卿不要公卿眼借青爭利爭名醒處看讀詩讀禮醉時聽姓名不欲樂人聞籍甚公卿舉似君李白猶將奴力士薛宣豈敢吏朱雲客來草草治杯盤道與家人勿憚煩但要陶泓毛穎在未為無以遺兒孫陳伯紀列岫一塔數椽崖半腰工夫草草意翛翛青山雖老猶兒態邂逅吾人喜欲驕江瀕湱湱不容暑竹杪騷騷那攬塵只隔一重窗紙影蚤分俗客與幽人文書倥偬汗糢糊問有清涼世界無走借主人煙雨觀幻吾身眼入氷壺題徐子比獨秀亭二首鄰山三五百為曹氣伏心降讓我高獨秀不知為獨秀退然自視一秋毫之子於人第一流於山也獨拔其尤亭高未與山相稱更起元龍百尺樓贈畫師韓暉史皇法外有遺機難弟難兄似得之信意揮毫無㸃誤蠅成於㸃誤還奇工於繪事諱言工韓滉心寧與俗同惡語發揮非敢惜所疑不是子家風題三生圖閒去閒來自在嬉故人不記問為誰都來一箇真消息安用頻更可漏為老范善畫牛有學為八牛圖者一犢在前又置一持竿牧其後有客過豫携此圖出因題二絶句酬之熟事為山白水牛曉那須放夜那收牧童已作冗員看況復持竿在後頭誰謂羣牛戲寫真犢前牝後更精神不知老牯心枯淡豈有將身作化身余得石山二座西南道李監場索之附海船歸三山圓嶠方壺共五山上隨潮往下隨還二山流落初何在新喜歸吾几案間初得兩山排闥來滿期突兀老相陪忽如雙劍擅飛去疑是六丁爭取回長料負山人不多眼中今失兩嵯峨非渠偶有夸娥力如我太行王屋何浙峯既有飛來者菱石能無取去人來去儻然均一理歐公何苦把眉顰君今得我玉嶙峋附搭東艘過七閩且試挾山超海手休為負石蹈河人余得英州石山副之五絶句送曽鼎臣小山欲與嶽為曹其末雖危本則牢屹立挺身行所獨旁羅垂首讓其高湖上飛來小祝融羣青在側一居中何當容衆常相下不必稱孤獨自雄嵒嵒逈不與凡同骨有餘清豈久窮雅趣未應為獨行皇恩猶許視三公夢不曾為嶺表遊眼中陡頓有英州知君結此石交後一洗從前勢利羞吾宗世住望仙村華蓋崢嶸日在門忽得祝融尤可重方知華蓋未為尊聞蟬五絶句奉呈諸幕友炎帝乘風馭氣行前驅警蹕羽仙輕胸中一部鈞天樂吐作衙官喝道聲羽仙塵外學修行未蛻那知身已輕露裏厭為無事飲風前戲作不平鳴風裏為生露作糧腹中瀟灑口清涼長歌商頌聲初振細聽韶音味可忘靜坐幽眠自及聽我新兩耳作蟬鳴蟬今更向耳邊噪會妄歸真作一聲語那似默得便宜蟬漫三歎復五噫養氣何妨為孟子知音不必要鍾期重九對酌豫章高處是龍沙前嵗曾陪醉孟嘉短白幸餘頭上髮柔黃今戴廣南花迎倉使李監丞八絶妙齡徒手掇科名發軔風雲九萬程捷徑何妨聊決起通途自分且徐行一尉初收百里塵一同尋放萬家春留中幸到爭先處請外甘為勇退人星屏熊軾兩從容未始論功莫大功南劔人人無劔氣宜春在在有春風二十餘年兩度來來賓蓮幕主霜臺今吾猶是故吾爾白眼豈須青眼哉入境諏民察吏餘羅浮賞罷更豐湖相迎魚鳥如相告車騎今回又較都農瓶無粟可重搜官帑錢猶地上流望我方來觀俗使從今且作富民侯南海江山鬱所懷今晨何喜夙容開一千里外行人報二十年前知己來同游漕幕舊三賓臺府兩為新主人應念江西撙齊老長裾猶曳幕中塵賀廣東黃漕生辰六絶博落山中黃子陽少從季主受仙方道成初試飛升步引手蟾宫折桂香詔會蟾宫籍裏人召還仙闕作仙賓王宫專席談先聖朝路分班謁上真奏事口含雞舌香仙賓俄轉作仙郎漢留不住王中散又駕仙風出帝鄉計臺使長祕書丞一自去天三館輕行詔仙郎主仙監道山風月倍光明數從仙伯至仙公一嵗一遷三嵗中三嵗三遷吾事足歸教明月弄清風上界仙官執禮勤逍遙歸入散仙羣百千嵗後人相識白石山前黃老君上廣東運副馬少卿壽十首壽星瑞世現光明俄轉桐江作客星千載嚴陵後身出風標氣槩兩亭亭客星又轉作魁星蚤應文科䇿漢庭紫氣初來朝北極長鵾一奮刷南溟魁星又轉作文星玉筍班分博士清鼓舞辟雍羣弟子依歸絳帳老先生文星又轉作郎星曉握蘭香上玉清屹立太微東北角是非時與上台爭郎星又轉作侯星上据中階下列城時號嘉興為輔郡出分重寄護行京侯星轉作使臣星驛傳軺車得按行天節前驅繡衣出蔣山搖動大江清使星轉作副樞星天柱天階兩手擎閹幸斜輝欲相射回纒退舍養吾明樞星轉作內平星內得其平外亦平貫索已沉牢口退又隨錢榖向南明平星轉作上台星獨運璇璣握玉衡蹀躞穩行黃道濶熒煌長伴紫微明台星久出照寰瀛懶入端門傍御屏上叩北辰乞閒散南歸長作老人星瑩老自浙歸住廣州光孝移住南華南宗要勘北機關踏遍江湖淮浙山始信廣東元有佛打包依舊更南還重脫袈裟掛廣州與人說法口如流放生池裏魚傾耳受戒壇前石㸃頭終年盡日講楞嚴舌自深藏口自緘腳指今將舌頭去懸知滿閣是空函無苦那從復覔甘堂頭與水已相諳猶將達磨泉中意更去曹溪滴裏參制止寺中房相硯曹溪堂上祖師衣舊家公案新拈出兩樣機關一指歸再遊南華看祖師衣鉢西方達磨問歸程衣鉢都留作麼生正道眼空嫌長物如何更帶履同行達磨將身帶履歸殷勤分付鉢和衣更和衣鉢將歸去免與中華講是非佛自無言人自訛但留衣鉢說能多假令和履多留下誰奈沙門頰舌何梅嶺有松無竹與梅結友問為誰松竹中涵霜雪姿竹豈寒盟已仙去宿心惟有老松知談賀州勉賦水仙花四絶會逢青帝欲回春先與梅兄清路塵自别其衣黃一㸃示吾不敢與兄均與水相蒸暖盎春湘妃洛女是前身乘風香氣凌波影挑弄眠冰立雪人高固難為太素容卑還惡紫又羞紅柔黃軟白交相炫色一歸於正與中玉女瓊姬暫謫居水中無可與為徒蓮花固與六郎似貞女終輕賤丈夫石屏余蓄石屏風十游雅宜喜而求之輒遺其一侑以五絶月走地中忙喪精化為異石琢為屏其中幻盡山河影不止數峯江上青巨靈神手造江山潛寫為圖置石間嵗久石為圖所變一重巒下一重灣太行王屋兩嵯峨移置石間痕未磨指似行人無識者化身吾恐是夸娥后土心恬不愛奇初陽人故得私之我新取道祁陽過鬼發其藏使見隨大道要為天下公割吾所愛以歸儂北窗不在西湖上驚見飛來湖上峯回鴈峯每向畫圖詩集看祝融如孔鴈如顔鴈峯今幸一相識實校於名大似慳揚雄非有動人姿蓋代清名天下知回鴈名今與雄等豈忘外陋慕中奇賓鴻初忌瘴邊嵐山到峯前不更南近日鴻多更南去峯名幾似晉清談鴈入窮南失意多以峯為記誓毋過寧無忘記蹉過去彼自輕生獨奈何此峯與鴈作標題記不分明有忘時鴈自會書真草字標題安用此峯為清湘城西飛來峯邂逅南鵬怒輒翔乘風附翼過清湘羅浮本是仙家景借與如來作寶坊三處飛來等樣奇佛無所擇我何辭重輕較到毫釐處鴻鴈行中此白眉鬼輸天雨玉崔嵬乞與湘人眼豁開為報湘人莫私有飛來有日更飛回仙洲弱水空傳三萬里瀛洲只隔一重關渡船莫傍梅花岸岸上吾疑是世間余入廣始見鄉士劉飬正于韶歸里社聞名已數年恨無傾蓋盍簮緣子初游學吾游宦一笑相逢韶石邊好景番禺能幾何簿書不許我吟哦絳紗帳裏事渾少古錦囊中詩定多轉蓬同到嶺南州黃菊茱萸三送秋東道雖青開閣眼西風空白倚門頭義産蓴菜中秋大熟副以六絶送楊伯子秋行春令氣猶凝栁曳寒絲軟蘸氷又似瑤池樂棚下鬼工遺落水晶藤垂垂水線白封青一筯能生兩眼明分野自為牛女地如何墮落玉繩精吳人縷玉作常烹南粵相逢眼却生張翰思歸食忘味鑑湖震澤見於羮齊芝自可侑仙斟忌把鮮肥俗味侵羮茁鱠鱗清濁混季鷹猶未是知音仙苗風味淡為宗能誘長安客欲東浪說棧羊餘雋永施於高士了無功蟹肥鱸腯未堪誇橘緑橙黃正自嘉左手把蓴右持酒何當共醉木犀花始生之日有籠禽而獻者口占二絶放之湯網恢疏未棄捐絳紗籠裏是壺天儻來富貴曾聊爾歸去山林乃自然禽言勸我不如歸似念官卑俸入微或道哥哥行不得家貧歸去更無依戒永州道聞思歸樂宦遊佳處是零陵廩稍優饒水石清心不思歸歸不樂汝休强勸拂人情張翰陶潛出信緣思蓴愛菊返丘園帝魂已託杜鵑去今汝寧非二子魂田園無力辦難俱有一猶堪學把鋤二者即今皆未具教吾歸去却何如看英韶山石千年一遇舜南巡山獻祥雲水獻珍后土别無堪效意百般裝出玉嶙峋參天韶石有餘奇臣視金精吏武夷鴈蕩天台疑可僕瞿塘灔澦得非雌中都寄廣東提幹彭元忠舜峯蟲鳥亂號呼猶是簫韶節奏餘入耳雖歸哦咏裏收心更聽寂寥初君到韶如杜到䕫新功不比舊爐鎚磨礱詩律如韶律未必知音有仲尼同年同郡更同官無適非同況嵗寒最是西湖好同賞却將先後到長安十期九度自參差彼此無辭可遂非投老江西沙石畔鷗盟不請更相違城狐憑高負固恣為妖自謂身安物莫搖燻灌幸人俱有忌不知鷹犬不相饒張彥容病未安却問余病就報之誤把維摩作病看不知自缺起羸丸殷勤浪說安心法將取心來與汝安彭澄之告以卜築佐之一緡一石二絶句以為親舊倡今難復用古橧巢頭上猶須蓋把茅金屋少為書所紿數椽新擬卜西郊家無儲粟況無錢佐費吾其以義先一石一緡未為厚量渠背負與腰纒代董華卿以葺廬無力告於親舊間敗屋猶餘茅不多其如凌雨震風何破誰一部慳貪相還我數間安樂窩辟穀無方强忍貧今難於忍以情陳不反君眼青為白可使吾廬故作新儒家子劉宗慶發披戴願贈二絶句俾藉以謁樂於成人之美者走俗何如學步虛出家猶缺護身符憑誰成就奇男子徑句歸投大丈夫未得黃冠換白襴不妨持鉢乞檀間要還少室山人願須破多金長者慳羅子琳謁趙香山得錢十緡米三石意若未滿以詩見報為賦四絶廣文鄭子槖雖枵司業蘇君惠已饒未到多多堪塞屋也須僅僅得纒腰魯公乞米出於真邂逅周瑜慷慨人借謂囊猶未為癭懸知甑已不生塵多金長者未嘗慳豈獨於君故作艱但道歸囊尚羞澀安知不判給銅山主人長念客鳴腸况復花封是稻鄉指廪何疑猶出手歸艘豈患不連檣有售畫于豫令作楊栁黃鸝池塘萱草既成可觀用隨題賦二絶句尋常鶯在栁間鳴嬌色嬌聲兩盡情兹狃爾嬌明弄色殆銜何恨暗吞聲一假池塘萱草奇其形便畫理便詩到離形處畫之妙詩妙更無形可離西蜀泉上人久留中都佛出西方打底州西方何用更東遊騎驢莫說尋驢事辦取工夫一轉頭擔水人家旦過寮騎牛來看浙江潮相逢便說三生話不管人嫌舌太饒特地東遊訪祖師東人占了鉢和衣幸餘隻履為心印猶在西方可急歸閣皂山道士晏時中過我南浦久之告歸忘家未足更忘形散鶴孤雲跡不停三楚江山心未飽七閩泉石眼初醒孟陽風月小彌明猶子于今有典型已得旌陽傳道妙猶從彭澤乞詩靈客裏相逢天一涯吾歸未得羡君回閩山荔子量分去庾嶺梅花剩寄來贈玉牒道人神融氣會李淳風收拾乾坤風鑒中莫怪人前言者中何逃物外眼之空過情君勿許遷除屈指吾年六十餘晚景固猶多暇日全工僅可了殘書立春日羯鼓催春春尚回况公夜擁軟紅灰五更溫厚東南氣煦煦妓圍深處來疏山草徑蜿蜒十里間雲關若在畫圖看萬松密翠地無影一水長清天自寒遣興開窗攬鏡岸烏紗嵗月崢嶸任物華觸事輒灰心裏火看書徒盎眼中花直上衝天髮欲虯斜飛控地鬢還彪目中已決行藏䇿贏得從今不倚樓壬戌二月十九日都巡李叔永躬按酒課于會田市二十八日聞余且至還家若相避然賦三絶臨卭界裏杏花村戲著家人犢鼻裩試問長卿躬滌器何如作賦獻金門宜城桑落有堪沽三百青銅豈是無不飲桃花不相笑桃花知道缺當罏主人來叱麯車回客子涎流口欲開阮籍已收青眼去陶潜休望白衣來山谷詩集有題淨因寺壁二絶句未知寺在何處甲子秋余逰富陽妙山之淨因寺用次山谷韻書以遺寺僧如智三面稚松爭短長西偏老竹絶炎凉千尋以上有秋色十畝之間無夕陽迂路逰山信愛山偷閒疑未是真閒煙霞謝事其容傲猿鶴知機也意闌校藝排號次成二絶呈元輔坡老不期遺李豸歐公猶誤取劉暉㸃頭道有朱衣吏今古相傳未必非明日譙樓榜已開網疏寧免有遺才諸生莫作冬烘看二老曽經眊矂來
