body:
  text: 緣督集卷十宋曾丰撰頌紹興淳熙兩朝內禪頌并序紹興三十有二年六月丙子高宗皇帝有詔內禪淳熙十有六年二月壬戌壽皇聖帝有詔內禪百官萬姓驚喜相與言堯舜以前禪無聞也堯舜以後至五代間有之求得其正則數千年不一見焉今兩朝垂三十年內禪至再以父子繼體之親為堯舜超世之舉實社稷無疆之休中外莫大之慶臣惟堯八十九嵗禪于舜高宗之禪與堯等而蚤於堯三十三嵗舜九十六嵗禪于禹壽皇之禪與舜等而蚤於舜亦三十三嵗舜之禪視堯後七嵗壽皇之禪視高宗亦後七嵗猗歟都哉亘千萬世莫之及矣父堯而子舜其位俱禪一可頌也其禪俱蚤二可頌也蚤於堯舜俱三十三嵗三可頌也先後與堯舜俱七嵗四可頌也堯舜禪于賢而已兩朝俱得聖子而禪之五可頌也臣誠歡誠抃頓首頓首敬為頌其詞曰維堯則天與天同大俯視九州細於一介挈以畀舜超然自邁維舜則堯與堯同高俯視四海細於一毫挈以畀禹熙然自陶堯舜之禪允矣嘉躅若稽厥齡或耄攸趣洪惟高宗才五十六遽行堯事有斷于獨洪惟壽皇才六十三遽行舜事不謀于僉未倦于勤先養其恬功成身退道與天參聖人視天遞退遞進進退俱休堯舜之運於赫兩朝德宏業峻銖較寸量寧啻堯舜堯七十六治水云初咨嶽試鯀不遑寧居高宗時則斯慶壽餘久與道息心實若虛舜六十三即真云始咨嶽相禹不遑寧止壽皇時則斯巽位已新與道休心豁若洗凡退政幾等謂大徽此退之蚤彼退之遲遲容可及蚤孰踰斯凡傳國璽等謂大媺彼傳之賢此傳之子賢容可求子孰獲只傳子若賢一出於天天固與子尤人所便便而遂者榮具慶全退蚤若遲一關於數數固與蚤尤人所慕慕而得之榮全慶具蚤於堯舜三十三年獨不一後獨不一先兩時吻合時乃自然舜後於堯七嵗而禪胡為爾稽匪有攸戀不欲與堯匹休齊善壽皇禪意蓋與舜俱所後七年匪迹是拘不期而同自然之符高宗禪時久暘忽雨雨應云何恩洽以溥壽皇禪時久雨忽暘暘應云何德輝以光得天之應誕彰孔盛新皇丕承合為三聖用牲于廟靡靈弗歆式昭新皇上合天心決政于堂靡懷弗暢式昭新皇下符人望天人同歸欲逃莫從雖父傳子亶為至公漢唐豈無揖遜之主非出本心未為盛舉猗三聖君真堯舜禹三聖一家纍洽重華前未之有後無以加小臣獻頌大而非夸修文立武頌並序斌哉頌瓊公宋宗室魏邸也上乂為文上與丄同尚也乂治也止弋為武弋射也楚子曰止戈為武未也弧矢之利以威天下非戈比止戈則弋可知以遫效焉慶元五年西黎謂臨高黎冦邊擁彼關矢攖吾控弦害其衄矣曾是罔悛明年公來遡所以然曰不在彼此失其紀我其紀之禮義亷恥表是國都形于田里驕驕者馴垝垝居毁切者峙黎莫窺公䇿詘技窮黎技尤長於弓矢直東南黎南謂澄邁黎東謂樂會黎歸我疆封乃乘其會徠降乞容四月丁未西黎警至五月師還而黎遁六月丁亥南黎降丁酉東黎降七月庚午西黎降惠然懬音曠然與之大同此頌之所為作也公於三黎挈所侵地降之二月築堂曰歸疆翼以亭曰修文立武歸疆自修文立武出文修武立之效變夷為華歸疆效之一爾故不書其詞曰斌哉公兮丁黎牾兮反自撫兮亶元后天覆無我若汝兮董爾僚釐吾天序兮九法筏筏勃其豎兮誰又我􅟉渠語切兮爾校傳相歡勿闡而㿪胡官切箭器也兮勿䦱于委切闢也而靬居言切盛弓矢器兮勿闓而簍力甫落侯二切車弓籠也韔靫楚崖楚加切箭室也韊力丹切藏弩矢服也兮公上我邦之乂以止我校之弋逡其虎賁以自媻兮謂師還也斌哉公兮丁黎狺兮反自揗食閏切磨也兮亶元老地載無我若人兮麾爾校迪吾天倫兮三綱几几廩其􅞽直珍切列也兮誰又我匹賓切爭亂也兮爾黎傳相告勿攄而韣徒木反弓衣也兮勿抉而箙扶福切矢器也兮勿掀而鞬䡬無願切車也㣂五責切束弓弩簶音祿箭室兮校上我師之又以止彼黎之弋逶其蟻潰以自宓兮謂黎遁也斌哉公兮丁黎䍴於偽切羊相䍴兮反自揆兮亶元戎海涵無我若爾兮格爾黎寤吾天理兮五常炳炳劼其履兮誰又我抵兮吾伍傳相號勿神􅌢兮勿繟充善切繟帶也而轑力道切車輻也兮勿紓而醫於計切盛弓矢器韘皾徒木切櫜兮黎自上其又而自止其弋逛其往切走貌其虻附以自陶兮謂黎降也修文立武三章章七句三章章五句表代但大夫自廣東憲除廣西漕又易廣東漕到任謝表讞獄無功駭被將輸之命捫私未便叨承易地之恩靜省非材多慚不稱臣中謝伏念臣少時學問雅志事為中濫專城精爽徒迷於簿領晚充煩使驅馳浸耗其聰明僅能逃不職之愆豈復有可資之策兹令飛挽孰誤選掄恭惟皇帝陛下身已致平慮不忘逺急嶺表之蒙惠為計臺而擇人南方事體之同雖二廣奚分於輕重東部土風之異謂小臣幸稔其淳漓度䇿馬而將西俾改轅而復舊寵榮至渥報塞實難臣敢不周視歉豐謹權取豫賦以馭其用寧無遺給餉之謀道御之而王要不負愛民之意代廣東漕賀會慶節表小春協氣儲為生啓之祥薄海歡心競起祝堯之敬臣中賀恭惟皇帝陛下建是皇極同乎大通推四海之寵恩已涵動植享萬年之景命未答憂勤長與蓬壺不老者俱始滿臣子無窮之願臣叨糜將漕阻往奉觴側耳聞韶迹莫陪於獸舞仰天見日心不異於葵傾代廣東常平賀會慶節表十月小春爰啓誕彌之節千秋嘉會聿修於赫之儀四海臣鄰一心詠頌臣中賀恭惟皇帝陛下懋明大德昭嗣丕圖聖度涵洪五兵不試天衷簡靜萬物莫干其源一根乎仁於理固得乎壽臣叨司倉腐邈在海瀕搢笏稱觴阻聽大韶之奏擡頭見日同伸中嶽之呼廣東漕移廣西謝上表委節從天將輸東部疏恩易地飛餉西陲等是處以嶠南得之出於望外可謂之幸孰酬所私兹蓋伏遇皇帝陛下御衆以寬使人也器曲取踐更之熟輕分臨遣之華祗服寵榮誓鞭罷鈍先及期而度嶺後聞命而改轅才至九韶觀民風之未審亟趨五管宣德意之有休凡課田租一資兵糗他寧乏用斷勿橫征無郊不閣宿逋有詔宜寬新賦人民受賜已諧足食之謀臣子報君更盡裕農之職知德慶府到任謝表臺閫騰章言堪試郡冕旒委聽詔使牧民非以常法與焉實為誤恩可也臣誠惶誠懼頓首頓首竊以南縣粵壤中介晉康山川勢壓於炎州藴藏王氣天地意歸於高廟開闢潛藩大運為之復昌土風賴以增重誰其可守臣也何人少竊儒科學未足以充其志六更吏職拙奚事乎將以勤一黜幽而退巡復使過則知勉惟道自融與天相似其捐一萬戶無德色所給二千石何容心祿厚難酬敢為不事事者民淳易治可以無為為之政教行於當然農桑勸則足矣拔二為長若為稱乾坤之私化頑成仁其或塞宵旰之望他無易此終不替初啓代賀范參政自建康得祠啓久圖均佚纍疏叩祈天眷優隆曲遂石湖之樂琳宫清邃雅宜朝迹之收數出頗勞一間併償恭惟某官肯輕亞相留護陪京一心久空萬物俱厭口飫鼎食乃憶一瓢之清足兀沙隄反思三徑之適投紱似疑沽矯謁祠庶免犯嫌九重重發而未俞再四力請而不已胡爾獲命豁然慰懷殆陶朱五湖之遊家聲不容墜而賀監一曲之勝心賞未及酬試賦歸歟聊寬憩只日對奎畫之揭神與筆俱如聞玉音之褒喜隨賜發比之當國倍以為榮某辱知最深占賀敢略東坡之詩嘗和固不虛昭回下飾之光西子之迹猶存更可續濃淡相宜之句嗣有召節恐無餘工賀江西提刑馬少卿上任啓肅擁使華疾趨臺治由重湖入五嶺始疑去國之愈遙自瀕海出大江今覺還朝之漸近笑開神觀歡動門闌竊以民莫頑於江西訟尤健於天下黼座參祖宗之制憲章雜文武之臣所以分平反之勞庶乎鮮寃濫之失人不同其向背事未免於是非比嵗廟堂主張專任之説諸州牒牘責辦獨員之功按之三尺則密處或流於吹毛斷以六經則恕中或至於漏網必於道與法而不悖非以儒飾吏而莫能恭惟某官以不凡之資為有用之學負才多而知己少擢第早而立朝遲守多移于窮誰似彌窮而彌守剛太過則折獨能益折而益剛初焉恥事於詭隨久則養成其定力浮榮莫動處九棘不殊於二松大事敢爭視三台無異於一介要不違於斯志與無負於吾君升沉兩相忘了無汲直後來居上之妬中外俱自得安有蕭生雅意在朝之貪一出十年連持四節將漕已勞於嵗月詳刑何止於再三豈以珥筆之吳人甚於好劍之楚俗圜扉草鞠前功已表其人為貫索星沉後驗更期於天應二百年國家之滲漉十一郡牧守之拊摩道院之風未渝惠文之事可掃想故國於高臺之上略為東坡而拂塵望長安於落日之西遄歸北極而奏效此懷姑置吾道益尊某入幕已榮受㕓尤幸聾瞽敢輸其聞見濁清當勇於激揚與其惟小是懲寧若自大者始區區雞肋不足凂尊拳之施犖犖盤根何當觀利器之發愛甚為之忘分頌終所以致規通新除江西漕林大著啓觀風報成得命易節久輸嶺表遺愛與南溟之水而俱深還按江西和氣隨大庾之春而同出先聲譁莫之禁後進喜至于狂恭惟某官雖鍾委和猶力攻苦學所致者自不欺其室積至于通神明養之浩然充無餒之心直可以塞天地視六經猶為土苴輕萬物豈翅鴻毛彼雷同之科名與平入之官爵疑若凂我初未始屑就焉自然逼身有不容却去者甘在常調殆將終身驟然置之通班恬若出于固有攬蓬萊之勝殊不肯自驕幹山海之饒亦未嘗或猒清邪濁邪無擇逺者大者可知今猶為十一州而來少亦有千萬人之活某心所望者大喜焉倍于常逢人輒談同輩交賀長卿使巴蜀幸得為縣令為道左之迎劉晏漕江淮寧不少士人為門下之客通安撫程給事啓輟自近班來為連帥鎮撫南國山河本重而復增奔趨下風雲霧未披而已快敢沿修敬先寫願言恭惟某官揉毫歸於純臨大視以細自筮仕之榮而厠朝列崇卑一聽自然以塗歸之氣而代王言褒貶孰非至當所施皆可以法其用豈比於常執政猶虛偃藩似左居今國勢南昌控江西之衝閲舊廷紳上意眷門下也厚雖臯陶未相未宜離舜右然汲黯不出不足重淮陽假之節旄慰彼癃稚下車餘半載日淺恩深出教數十條言近意逺凡肯建明者若出遊戲然不知緒餘之成皆自真積而發少須晚業當更混成某氣以涉世而平心之厭官也久自幼多病百苦皆攻筆研固所便與時少諧一丘可老耰鋤非其志與其塗足寧若折腰簿書有時間燈火不敢廢勳業由命幸而成未必幸而傳文章在人可以觀獨不可以久度力所能者隨宜而立焉徒自鞭成竟誰印可所愧未工而敢獻其他非面則莫商二松不足哦猶竊誦東坡鬱孤臺之作孤鶩有餘興何當從閻公滕王閣之遊一語偶然相投百懷可以續告謝漕使蘇大卿京狀啓蒙恩易節為國搜賢胸次素有權衡初疑不苟江西豈無人物首及非才正兹闕一而足之豈比循常所薦者分暌道合施重身輕竊以士得一命之榮類萌寸進之念自讀書而取科第平生事始得半之無憂以選調而改京官故舉主必求全而後可稍稍參差於是往往僥幸也難須得職司始應銓格常員有缺猶可泛求大狀不圓復何從得況今且速代者雖巧殆將問誰日程計已無多機會間不容髮儻更一跌又遲幾年美事少至於十分故仕不榮於賀上而榮於賀下大功常廢於一二故恩不重於成始而重於成終非長者為之動心幾茫然無所措手伏遇某官心雖泛應物實少投以家傳之文章鑒世文章工拙難掩移自得之學術探人學術淺深莫逃二端俱造至高餘事蓋不足辦庸非以唐虞三代公卿所建不出於鄒魯諸公磋切之精於焉擇士以報君必也加意而致謹借難求備未嘗以周孔顔曽而責之姑且酌中要得夫荀揚韓柳斯可矣有如某者養未到熟豪猶欠磨徒求師於公榖未得春秋之妙空慕名於馬班豈及風雅之純語其有志則誠然褒之不情則太甚偶爾值喜機之動忘其為溢美之多薦周子於榻前恐似出東坡居士之誤出歐公之門下當增我南豐先生之光彼此以道相從施報又通漕使蘇大卿啓肅將上指榮按南州風聲從閩嶠而來江山為之動色士氣喜潁濱之後冠帶至於生光況是寒蹤又其屬吏其為幸也豈比泛然恭惟某官稟初異常生更得地眉為西蜀之秀氣所鍾人人皆清岷據大江之源士之學往往有本矧厥世閥蔚乎文宗父兄每談耳目俱滿自童至壯氣習若出於性成推已及人家傳乃為乎世用留中籍甚補外恬然天下如彼其寬江西豈公所擇雅惟先德散在諸州贑上之古詩數篇筆蹤粲石面而未泯筠陽之雜著一集手澤落民間而或存上於厥祖之風尤敬焉今以其孫而使亦寵矣觀風容有暇訪舊不亦榮物外得其遺文公餘可以適目用其孫猶用其祖當有以報上之知睹其迹如睹其容豈不慰奉先之念共扶此道要得其人某無謀而窮有志於古質之師友文章惟兩漢之歸揣其門庭法度自三蘇而入未全成就猶少規磨兹者遇其雲來庶乎得以印證魏謨視鄭公風烈則不減行佐唐宗孔伋得尼父中庸而未傳願為孟子至於其職非此所陳通贛州趙守啓久用仰高始逢補外慶源宏演分天上近𣲖之清治境恢雄據江西上遊之勝人地幸而俱重軍民可以同休恭惟某官雖名王孫其實士類詩書氣習豈肥馬輕裘之可遷枯淡家風有布衣韋帶所難處物莫搖所養才可立於時猶為格拘肯以符出訪避秦之仙客恐桃花水肥而不行聞度嶺之詩人喜梅蘂風清而可挹遂移武陵之步來探大庾之春稍餘燕間有足酬酢收而藏之胸次時以散於民間使千里無非東風庶九重少寬南顧某殘秩未滿餘庥足依臭味或者相投喜歡至於欲舞章貢景物豈不美且賡東坡微霰之篇崆洞道機猶有餘留對黃帝下風之問賀贑守莫郎中啓榮驅節旄出偃藩屏方當郊迓春已塞於行李之中不待政成人皆信於下車之始更遲數月必有偉觀竊以古無不可為之州世所未易得者守惟今之贑蓋迫於蠻江西嶺南之交地無乃惡風聲氣習之舊頑不可鐫粵自五季以來凡遭幾變于此或者為之深慮至於鎮以重兵聽軍與民交相為市使酒尚氣動輒殺人緩之則長姦急之則召亂殆若為處貴於適中然非更厯也多其能劑量乎否上所遴選得之誠難某官稟天之和養氣以直入官雖蚤不以最吏部而遽休嗜古益堅終之第太常而莫禦盍歸持槖猶出専城夫初試已有餘功則再為蓋不足道苐聞黠吏狃前政之寬而猶欺故使齊民處太平之日而或怨所望於公者當有以處之至於兩得其歡必也一歸諸理或權其用非治吏其何以活民但持此心雖為郡亦所以報國等之而上廣是以充某嘗快即溫更陪聞喜遽爾升沉之異歸于義命則安夫今所言豈舊敢敘但願以萬言之對且施民間庶可推千里之恩以及天下賀丘檢詳自平江移帥紹興啓一從違逺兩拜詔除移顓千里之吳鎮拊之手再展而益熟擢殿十連之越按臨之蹤重訪則尤榮輔郡得人上京增重粵從圖志之上夷考會稽之初由禹得名至勾踐遂為強國自秦置郡逮紹興始號陪都以府易州其守為牧皆所以重一路之託又從而壯中朝之觀三軍寄命於元戎萬里托生於刺史上之謀帥常患才難今乃得賢斯與地稱恭惟某官以遺經之學收異等之科魏弱翁立朝而斥權臣吕步舒出使而斷獄事胸中衡鑒莫非以筆削權吾是非天下搢紳孰不視進退為道消長奚方續韋應物之集又復綰朱買臣之章豈藩責之不輕而輿望之難塞與其他選敏手不免於眼生寧若公來先聲已使其心服天眷未為不厚鵬程無謂猶迂况威愛之兩全蓋軍民所素信令下莫之扞格政成可以舂容臥聽鼓角之聲疑從地下行視山川之色覺在鏡中蓬萊閣已似為瀛洲之符錢塘江豈能作弱水之隔某銜恩未報贊喜可知乘車馬以來迎悵阻覿長安之廄以春秋而具對行歸直承明之廬賀吕憲使移帥揚州啓肅奉恩綸榮遷帥閫片言折獄百城之囹圄方空十國為連夾道之旌牙遽擁凡託帡幪之下共歸鼓舞之中況曽沐於鴻私蓋不勝其雀躍恭惟某官夙儲士望洊厯官途初入綴於星郎俄出分於漕計錢流滿地兹才露豹之一斑草鞠圜扉稍見解牛之餘刃會攝居於屏翰爰大簡於車徒悅以使人衆皆賈勇軍容入國愕眙衆觀朝論歸功密簡天聽用是寵聯於內直忽焉擢起於外臺閩南萬里江山方欲入公之詩句淮右數州草木如何奪我之春風雖易地則皆然奈戀軒之不忍懋正東郊之尹行寬北顧之憂為國藩垣要使西人知有小范老傳家衣鉢誰云南渡無復大申公某拭目觀光披情贊喜徒厪三沐莫頌萬分上黃參政啓才自擢第即為聞人初試南宫藏逺業于揮染之下近登東府開太平于燮調之初夤緣幸兹及識焉嘗試誦所欲言者竊以本朝所重進士之科空占甲封一時為天下之冠最宜亞選終久結宸衷之知逖搜遺編追數前輩韓魏王之事業是為漢伊周王荆公之文章得非唐韓柳雖非建明者異要之遭遇則均由南渡積至于今惟申公踵嗣其美其他聞見所在詭隨兹蓋恭惟某官熏酣已成磨切不廢今推律已之道上以格君之心潛為國謀泰山不維而自固外聳朝望猛虎未哮而已威處是政機異乎言路鷹鸇逐雀一毫不藏滄海納汙萬頃無底夫今豈戾夫昔所行各隨所宜轉移之妙至於斯通變之學固然耳某幾為書誤屢與時隨有祿奉甘未忘攻苦平生筆研半為江山惟憲宗任度未有詩而宣帝得賢猶次頌一夔一卨幸免追慶厯之蹤三沐三薰當為試徂徠之墨賀周知院拜樞密使啓顯升樞極榮等宰衡初詔宣麻俱料明公之拜少頃聞報果如輿論所期士民交歡軍國增重恭惟某官人望已久主知更深惟其恬不肯前是以貴猶差晚翰林盤薄文章特其緒餘政府舂容事業出於遊戲天下已名兩絶胸中未動一毫處之如常上所加敬肆移樞管隂闔陽開而萬物莫知密擁帝車乾旋坤轉而四時不忒斯謂經逺若為酬勞爰增使命之華蓋示兵機之重遭時習治問甲少至於廟堂先事折衝運籌可廢於帷幄上意不特在此中原豈容置之某賀不欲諛規寧犯僭未肯薦韓淮隂而取楚直作蕭何猶當信趙充國之守羌姑為魏相二願儻不償一終心得無愧初兹其勉之乃所望者
